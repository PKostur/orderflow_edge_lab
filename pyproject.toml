[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-edge-lab"
version = "1.0.0"
description = "Research-first order-flow validation and paper execution infrastructure"
requires-python = ">=3.10"
dependencies = ["websockets>=12,<16"]

[project.optional-dependencies]
research = ["numpy>=2,<3", "pandas>=2,<3"]

[project.scripts]
orderflow-paper = "orderflow_edge_lab.cli.paper:main"
orderflow-paper-audit = "orderflow_edge_lab.cli.paper_audit:main"
orderflow-runtime-snapshot = "orderflow_edge_lab.cli.runtime_snapshot:main"
orderflow-session-audit = "orderflow_edge_lab.cli.session_audit:main"
orderflow-probe = "orderflow_edge_lab.cli.probe:main"
orderflow-validate = "orderflow_edge_lab.cli.validate:main"
orderflow-readiness = "orderflow_edge_lab.cli.readiness:main"
orderflow-discover-endpoint = "orderflow_edge_lab.cli.discover_endpoint:main"
orderflow-analyze-endpoint = "orderflow_edge_lab.cli.analyze_endpoint:main"
orderflow-audit-causality = "orderflow_edge_lab.cli.audit_causality:main"
orderflow-promotion-check = "orderflow_edge_lab.cli.promote:main"
orderflow-mexc-record = "orderflow_edge_lab.cli.mexc_record:main"
orderflow-mexc-replay = "orderflow_edge_lab.cli.mexc_replay:main"
orderflow-export-audit = "orderflow_edge_lab.cli.export_audit:main"
orderflow-export-bundle = "orderflow_edge_lab.cli.export_bundle:main"
orderflow-research-freeze = "orderflow_edge_lab.cli.research_freeze:main"
orderflow-candidate-freeze = "orderflow_edge_lab.cli.candidate_freeze:main"
orderflow-holdout-audit = "orderflow_edge_lab.cli.holdout_audit:main"
orderflow-trial-ledger = "orderflow_edge_lab.cli.trial_ledger:main"
orderflow-multi-agent = "orderflow_edge_lab.cli.multi_agent:main"
orderflow-backtest = "orderflow_edge_lab.cli.orderflow_backtest:main"
orderflow-direction-pair = "orderflow_edge_lab.cli.direction_pair:main"
orderflow-risk-ladder = "orderflow_edge_lab.cli.risk_ladder:main"
orderflow-stop-risk = "orderflow_edge_lab.cli.stop_risk:main"
orderflow-ema15m-hypothesis = "orderflow_edge_lab.cli.ema15m_hypothesis:main"
orderflow-market-state-scan = "orderflow_edge_lab.cli.market_state_scan:main"
orderflow-market-state-aggregate = "orderflow_edge_lab.cli.market_state_aggregate:main"
orderflow-market-conditions = "orderflow_edge_lab.cli.market_conditions:main"
orderflow-condition-aggregate = "orderflow_edge_lab.cli.condition_aggregate:main"
orderflow-pair-screen = "orderflow_edge_lab.cli.pair_screen:main"
orderflow-correlation-panel = "orderflow_edge_lab.cli.correlation_panel:main"
orderflow-news-monitor = "orderflow_edge_lab.cli.news_monitor:main"
orderflow-cross-pair = "orderflow_edge_lab.cli.cross_pair:main"
orderflow-discovery-aggregate = "orderflow_edge_lab.cli.discovery_aggregate:main"
orderflow-strategy-tournament-data = "orderflow_edge_lab.cli.strategy_tournament_data:main"
orderflow-strategy-tournament = "orderflow_edge_lab.cli.strategy_tournament:main"
orderflow-strategy-tournament-aggregate = "orderflow_edge_lab.cli.strategy_tournament_aggregate:main"
orderflow-ena-mean-reversion-risk = "orderflow_edge_lab.cli.ena_mean_reversion_risk:main"
orderflow-ena-forward-shadow = "orderflow_edge_lab.cli.ena_forward_shadow:main"

[project.gui-scripts]
orderflow-dxfeed-login = "orderflow_edge_lab.cli.login:main"

[tool.setuptools.packages.find]
where = ["src"]
