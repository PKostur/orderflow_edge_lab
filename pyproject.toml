[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-edge-lab"
version = "1.0.0"
description = "Research-first order-flow validation and paper execution infrastructure"
requires-python = ">=3.10"
dependencies = ["websockets>=12,<16"]

[project.scripts]
orderflow-paper = "orderflow_edge_lab.cli.paper:main"
orderflow-paper-audit = "orderflow_edge_lab.cli.paper_audit:main"
orderflow-runtime-snapshot = "orderflow_edge_lab.cli.runtime_snapshot:main"
orderflow-session-audit = "orderflow_edge_lab.cli.session_audit:main"
orderflow-probe = "orderflow_edge_lab.cli.probe:main"
orderflow-validate = "orderflow_edge_lab.cli.validate:main"
orderflow-readiness = "orderflow_edge_lab.cli.readiness:main"
orderflow-discover-endpoint = "orderflow_edge_lab.cli.discover_endpoint:main"
orderflow-analyze-endpoint = "orderflow_edge_lab.cli.analyze_endpoint:main"
orderflow-audit-causality = "orderflow_edge_lab.cli.audit_causality:main"
orderflow-promotion-check = "orderflow_edge_lab.cli.promote:main"
orderflow-mexc-record = "orderflow_edge_lab.cli.mexc_record:main"
orderflow-mexc-replay = "orderflow_edge_lab.cli.mexc_replay:main"
orderflow-export-audit = "orderflow_edge_lab.cli.export_audit:main"
orderflow-export-bundle = "orderflow_edge_lab.cli.export_bundle:main"
orderflow-research-freeze = "orderflow_edge_lab.cli.research_freeze:main"
orderflow-candidate-freeze = "orderflow_edge_lab.cli.candidate_freeze:main"
orderflow-holdout-audit = "orderflow_edge_lab.cli.holdout_audit:main"
orderflow-trial-ledger = "orderflow_edge_lab.cli.trial_ledger:main"
orderflow-multi-agent = "orderflow_edge_lab.cli.multi_agent:main"

[project.gui-scripts]
orderflow-dxfeed-login = "orderflow_edge_lab.cli.login:main"

[tool.setuptools.packages.find]
where = ["src"]
