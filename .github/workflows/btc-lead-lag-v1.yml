name: BTC Lead Lag V1

on:
  pull_request:
    paths:
      - 'config/btc_lead_lag_v1.json'
      - 'scripts/run_btc_lead_lag_v1.py'
      - '.github/workflows/btc-lead-lag-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas scipy
      - name: Compile evaluator
        run: python -m py_compile scripts/run_btc_lead_lag_v1.py
      - name: Validate frozen protocol
        run: |
          python - <<'PY'
          import json
          c=json.load(open('config/btc_lead_lag_v1.json'))
          assert c['outcomes_inspected_before_freeze'] is False
          assert c['state_layer']['required_before_strategy_pnl'] is True
          assert c['strategy_translation']['allowed_only_after_state_pass'] is True
          assert c['orthogonality']['no_second_indicator_in_v1'] is True
          assert c['promotion']['ruflo_gate_required'] is True
          assert c['promotion']['deterministic_multi_agent_release_manager_required'] is True
          assert c['promotion']['automatic_live_transmission'] is False
          PY
      - name: Run frozen state first screen
        run: python scripts/run_btc_lead_lag_v1.py --out research/btc_lead_lag_v1
      - name: Show summary
        if: always()
        run: cat research/btc_lead_lag_v1/summary.json || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-lead-lag-v1
          path: research/btc_lead_lag_v1/
