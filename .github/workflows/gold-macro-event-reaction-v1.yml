name: Gold Macro Event Reaction v1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-macro-event-reaction-v1]
    paths:
      - "config/gold_macro_event_reaction_v1.json"
      - "scripts/run_gold_macro_event_reaction_v1.py"
      - ".github/workflows/gold-macro-event-reaction-v1.yml"

permissions:
  contents: read

concurrency:
  group: gold-macro-event-reaction-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy beautifulsoup4
      - name: Fetch pinned XAUUSD M15 and official event-source pages
        run: |
          set -euo pipefail
          root=artifacts/gold_macro_event_reaction_v1
          mkdir -p "$root/data/fed"
          base="https://raw.githubusercontent.com/simom1/XAUUSD-history/bda79c6c5ce09a5b488d4cd2c20fcd19bdd2ed3a"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv" \
            -o "$root/data/XAUUSD_M15.csv"
          curl --fail --location --retry 4 --retry-delay 3 -A "Mozilla/5.0" \
            "https://www.bls.gov/bls/news-release/cpi.htm" \
            -o "$root/data/cpi.html"
          curl --fail --location --retry 4 --retry-delay 3 -A "Mozilla/5.0" \
            "https://www.bls.gov/bls/news-release/empsit.htm" \
            -o "$root/data/empsit.html"
          for y in 2018 2019 2020 2021 2022; do
            curl --fail --location --retry 4 --retry-delay 3 -A "Mozilla/5.0" \
              "https://www.federalreserve.gov/monetarypolicy/fomchistorical${y}.htm" \
              -o "$root/data/fed/fomc_${y}.html"
          done
          sha256sum "$root/data/XAUUSD_M15.csv" "$root/data/cpi.html" "$root/data/empsit.html" "$root/data/fed/"*.html \
            > "$root/data/SHA256SUMS.txt"
      - name: Run frozen development tournament
        run: |
          python scripts/run_gold_macro_event_reaction_v1.py \
            --config config/gold_macro_event_reaction_v1.json \
            --gold artifacts/gold_macro_event_reaction_v1/data/XAUUSD_M15.csv \
            --cpi-html artifacts/gold_macro_event_reaction_v1/data/cpi.html \
            --empsit-html artifacts/gold_macro_event_reaction_v1/data/empsit.html \
            --fed-dir artifacts/gold_macro_event_reaction_v1/data/fed \
            --output artifacts/gold_macro_event_reaction_v1/result.json
      - name: Guard research boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_macro_event_reaction_v1/result.json'))
          assert r['protocol'] == 'gold_macro_event_reaction_v1'
          assert r['grid']['cells_evaluated'] == 12
          assert set(r['data_integrity']['event_counts']) == {'cpi','employment_situation','fomc'}
          assert all(v > 0 for v in r['data_integrity']['event_counts'].values())
          assert r['locked_internal_validation_opened'] is False
          assert r['retrospective_extension_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-macro-event-reaction-v1
          path: artifacts/gold_macro_event_reaction_v1/
          retention-days: 30
          if-no-files-found: warn
