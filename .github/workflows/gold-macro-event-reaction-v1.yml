name: Gold Macro Event Reaction v1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-macro-event-reaction-v1]
    paths:
      - "config/gold_macro_event_reaction_v1.json"
      - "scripts/run_gold_macro_event_reaction_v1.py"
      - "scripts/run_gold_macro_event_reaction_v1_deterministic.py"
      - "research/gold_macro_event_reaction_v1/BLS_RELEASE_CALENDAR_2018_2022.csv"
      - "research/gold_macro_event_reaction_v1/FOMC_REGULAR_DECISION_DATES_2018_2022.csv"
      - ".github/workflows/gold-macro-event-reaction-v1.yml"

permissions:
  contents: read

concurrency:
  group: gold-macro-event-reaction-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy beautifulsoup4

      - name: Fetch pinned XAUUSD M15
        run: |
          set -euo pipefail
          root=artifacts/gold_macro_event_reaction_v1
          mkdir -p "$root/data/fed"
          base="https://raw.githubusercontent.com/simom1/XAUUSD-history/bda79c6c5ce09a5b488d4cd2c20fcd19bdd2ed3a"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv" \
            -o "$root/data/XAUUSD_M15.csv"

      - name: Materialize vendored official event-calendar snapshots
        run: |
          set -euo pipefail
          root=artifacts/gold_macro_event_reaction_v1
          cp research/gold_macro_event_reaction_v1/BLS_RELEASE_CALENDAR_2018_2022.csv \
            "$root/data/BLS_RELEASE_CALENDAR_2018_2022.csv"
          cp research/gold_macro_event_reaction_v1/FOMC_REGULAR_DECISION_DATES_2018_2022.csv \
            "$root/data/FOMC_REGULAR_DECISION_DATES_2018_2022.csv"
          python - <<'PY'
          import csv
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path

          root=Path('artifacts/gold_macro_event_reaction_v1/data')

          cpi=[]; emp=[]
          with (root/'BLS_RELEASE_CALENDAR_2018_2022.csv').open(newline='',encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  dt=datetime.strptime(row['date'],'%Y-%m-%d')
                  if row['release_time_et'] != '08:30':
                      raise SystemExit(f"unexpected frozen BLS release time: {row}")
                  token=dt.strftime('%m%d%Y')
                  if row['event_type']=='cpi': cpi.append(token)
                  elif row['event_type']=='employment_situation': emp.append(token)
                  else: raise SystemExit(f"unexpected BLS event type: {row['event_type']}")
          cpi=sorted(set(cpi)); emp=sorted(set(emp))
          if len(cpi) != 60 or len(emp) != 60:
              raise SystemExit(f'unexpected BLS snapshot counts: cpi={len(cpi)} emp={len(emp)}')
          (root/'cpi.html').write_text('\n'.join(f'cpi_{x}.htm' for x in cpi),encoding='utf-8')
          (root/'empsit.html').write_text('\n'.join(f'empsit_{x}.htm' for x in emp),encoding='utf-8')

          by_year=defaultdict(list)
          with (root/'FOMC_REGULAR_DECISION_DATES_2018_2022.csv').open(newline='',encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  dt=datetime.strptime(row['decision_date'],'%Y-%m-%d')
                  if int(row['year']) != dt.year:
                      raise SystemExit(f"FOMC year/date mismatch: {row}")
                  by_year[dt.year].append(dt)
          expected={2018:8,2019:8,2020:7,2021:8,2022:8}
          if {y:len(set(ds)) for y,ds in by_year.items()} != expected:
              raise SystemExit(f'unexpected FOMC snapshot counts: {dict((y,len(set(ds))) for y,ds in by_year.items())}')
          fed=root/'fed'; fed.mkdir(exist_ok=True)
          for year in sorted(expected):
              tags=[]
              for dt in sorted(set(by_year[year])):
                  tags.append(f'<h5>{dt.strftime("%B")} {dt.day} Meeting - {year}</h5>')
              (fed/f'fomc_{year}.html').write_text('\n'.join(tags),encoding='utf-8')
          print({'cpi_dates':len(cpi),'employment_dates':len(emp),'fomc_dates':sum(expected.values())})
          PY
          sha256sum "$root/data/XAUUSD_M15.csv" "$root/data/BLS_RELEASE_CALENDAR_2018_2022.csv" \
            "$root/data/FOMC_REGULAR_DECISION_DATES_2018_2022.csv" \
            "$root/data/cpi.html" "$root/data/empsit.html" "$root/data/fed/"*.html \
            > "$root/data/SHA256SUMS.txt"

      - name: Run frozen development tournament
        run: |
          PYTHONPATH=scripts python scripts/run_gold_macro_event_reaction_v1_deterministic.py \
            --config config/gold_macro_event_reaction_v1.json \
            --gold artifacts/gold_macro_event_reaction_v1/data/XAUUSD_M15.csv \
            --cpi-html artifacts/gold_macro_event_reaction_v1/data/cpi.html \
            --empsit-html artifacts/gold_macro_event_reaction_v1/data/empsit.html \
            --fed-dir artifacts/gold_macro_event_reaction_v1/data/fed \
            --output artifacts/gold_macro_event_reaction_v1/result.json

      - name: Guard research boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_macro_event_reaction_v1/result.json'))
          assert r['protocol'] == 'gold_macro_event_reaction_v1'
          assert r['grid']['cells_evaluated'] == 12
          assert set(r['data_integrity']['event_counts']) == {'cpi','employment_situation','fomc'}
          assert all(v > 0 for v in r['data_integrity']['event_counts'].values())
          assert r['locked_internal_validation_opened'] is False
          assert r['retrospective_extension_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-macro-event-reaction-v1
          path: artifacts/gold_macro_event_reaction_v1/
          retention-days: 30
          if-no-files-found: warn
