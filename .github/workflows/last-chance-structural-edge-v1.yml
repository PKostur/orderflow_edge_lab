name: Last Chance Structural Edge v1

on:
  workflow_dispatch:
  push:
    branches: [research/last-chance-structural-edge-v1]
    paths-ignore:
      - 'research/last_chance/results/**'

permissions:
  contents: write

concurrency:
  group: last-chance-structural-edge-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-exchange-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime and test runner
        run: python -m pip install -e '.[research]' pytest
      - name: Run structural-edge guardrail tests
        run: python -m pytest -q tests/test_cross_exchange_funding.py
      - name: Run frozen cross-exchange funding study
        id: study
        shell: bash
        run: |
          mkdir -p research/last_chance/results
          set +e
          python -m orderflow_edge_lab.cli.cross_exchange_funding \
            --config config/last_chance_structural_edge_v1.json \
            --output research/last_chance/results/cross_exchange_funding_v1.json \
            --max-workers 5
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print compact result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/last_chance/results/cross_exchange_funding_v1.json')
          if not p.exists():
              print('No result file created')
              raise SystemExit(0)
          r=json.load(open(p, encoding='utf-8'))
          if r.get('status') == 'data_source_failure':
              print(json.dumps({
                  'status': r.get('status'),
                  'loaded_symbols': r.get('loaded_symbols'),
                  'load_failures': r.get('load_failures'),
              }, indent=2))
          else:
              primary=next(x for x in r['cost_cases'] if x['round_trip_pair_cost_bps']==r['primary_cost_bps'])
              print(json.dumps({
                  'status': r['status'],
                  'primary_cost_bps': r['primary_cost_bps'],
                  'development': primary['development']['portfolio'],
                  'validation': primary['validation']['portfolio'],
                  'validation_positive_symbol_fraction': primary['validation']['positive_symbol_fraction'],
                  'reverse_validation': r['reverse_control']['validation']['portfolio'],
                  'gate': r['screening_gate'],
              }, indent=2))
          PY
      - name: Commit immutable research result to branch
        if: always()
        shell: bash
        run: |
          if [ ! -f research/last_chance/results/cross_exchange_funding_v1.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/last_chance/results/cross_exchange_funding_v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: preserve cross-exchange funding result'
          git push origin HEAD:research/last-chance-structural-edge-v1
      - name: Fail if study itself failed
        if: always()
        shell: bash
        run: |
          rc='${{ steps.study.outputs.exit_code }}'
          if [ -n "$rc" ] && [ "$rc" != '0' ]; then
            exit "$rc"
          fi
