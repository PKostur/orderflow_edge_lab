name: Gold FOMC Surprise Data Inspect

on:
  workflow_dispatch:
  push:
    branches: [research/gold-fomc-monetary-surprise-v2]
    paths:
      - ".github/workflows/gold-fomc-surprise-data-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install pandas openpyxl
      - name: Fetch SF Fed monetary-policy-surprise workbook
        run: |
          set -euo pipefail
          mkdir -p artifacts/gold_fomc_surprise_data_inspect
          curl --fail --location --retry 4 --retry-delay 3 -A "Mozilla/5.0" \
            "https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises-data.xlsx" \
            -o artifacts/gold_fomc_surprise_data_inspect/monetary-policy-surprises-data.xlsx
          sha256sum artifacts/gold_fomc_surprise_data_inspect/monetary-policy-surprises-data.xlsx \
            > artifacts/gold_fomc_surprise_data_inspect/SHA256SUMS.txt
      - name: Inspect workbook schema only
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('artifacts/gold_fomc_surprise_data_inspect/monetary-policy-surprises-data.xlsx')
          xl=pd.ExcelFile(p)
          out={'sheets':[]}
          for s in xl.sheet_names:
              df=pd.read_excel(p,sheet_name=s)
              rec={'sheet':s,'rows':int(len(df)),'columns':[str(c) for c in df.columns]}
              for c in df.columns:
                  if 'date' in str(c).lower():
                      d=pd.to_datetime(df[c],errors='coerce')
                      if d.notna().any():
                          rec['date_column']=str(c)
                          rec['date_min']=str(d.min())
                          rec['date_max']=str(d.max())
                          break
              rec['head']=df.head(5).where(pd.notna(df.head(5)),None).astype(object).to_dict(orient='records')
              out['sheets'].append(rec)
          Path('artifacts/gold_fomc_surprise_data_inspect/schema.json').write_text(json.dumps(out,indent=2,default=str),encoding='utf-8')
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Preserve data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-fomc-surprise-data-inspect
          path: artifacts/gold_fomc_surprise_data_inspect/
          retention-days: 30
          if-no-files-found: warn
