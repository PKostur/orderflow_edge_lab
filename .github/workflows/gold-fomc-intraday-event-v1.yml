name: Gold FOMC Intraday Event v1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-fomc-intraday-event-v1]
    paths:
      - "data/fomc_regular_decision_dates_2018_2023.csv"
      - "config/gold_fomc_intraday_event_v1.json"
      - "scripts/run_gold_fomc_intraday_event_v1.py"
      - ".github/workflows/gold-fomc-intraday-event-v1.yml"

permissions:
  contents: read

concurrency:
  group: gold-fomc-intraday-event-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy tzdata
      - name: Fetch pinned XAUUSD M15 data
        run: |
          set -euo pipefail
          mkdir -p artifacts/gold_fomc_intraday_event_v1/data
          url="https://raw.githubusercontent.com/simom1/XAUUSD-history/bda79c6c5ce09a5b488d4cd2c20fcd19bdd2ed3a/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv"
          curl --fail --location --retry 3 --retry-delay 2 "$url" \
            -o artifacts/gold_fomc_intraday_event_v1/data/XAUUSD_M15.csv
          sha256sum artifacts/gold_fomc_intraday_event_v1/data/XAUUSD_M15.csv \
            > artifacts/gold_fomc_intraday_event_v1/data/SHA256SUMS.txt
      - name: Run frozen FOMC development tournament
        run: |
          python scripts/run_gold_fomc_intraday_event_v1.py \
            --config config/gold_fomc_intraday_event_v1.json \
            --calendar data/fomc_regular_decision_dates_2018_2023.csv \
            --gold artifacts/gold_fomc_intraday_event_v1/data/XAUUSD_M15.csv \
            --output artifacts/gold_fomc_intraday_event_v1/result.json
      - name: Guard research boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_fomc_intraday_event_v1/result.json'))
          assert r['protocol']=='gold_fomc_intraday_event_v1'
          assert r['calendar_integrity']['development_rows']==39
          assert r['calendar_integrity']['locked_validation_rows']==8
          assert r['grid']['hypotheses']==8
          assert r['locked_internal_validation_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-fomc-intraday-event-v1
          path: artifacts/gold_fomc_intraday_event_v1/
          retention-days: 30
          if-no-files-found: warn
