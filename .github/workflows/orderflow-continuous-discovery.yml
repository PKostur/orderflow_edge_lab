name: Continuous Order-Flow Discovery

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: continuous-orderflow-discovery
  cancel-in-progress: false

jobs:
  capture-and-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Choose deterministic replay-retention tier
        id: retention
        shell: bash
        run: |
          set -euo pipefail
          KEEP_RAW=false
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            KEEP_RAW=true
          else
            HOUR="$(date -u +%H)"
            MINUTE="$(date -u +%M)"
            if (( 10#$HOUR % 4 == 0 && 10#$MINUTE < 35 )); then
              KEEP_RAW=true
            fi
          fi
          echo "keep_raw=$KEEP_RAW" >> "$GITHUB_OUTPUT"
          echo "keep_raw=$KEEP_RAW"
      - name: Capture 15 minutes of fresh public ENA/BTC order flow
        run: |
          mkdir -p artifacts/orderflow
          orderflow-mexc-record \
            --symbol ENA_USDT \
            --symbol BTC_USDT \
            --duration-seconds 900 \
            --output-dir artifacts/orderflow
      - name: Evaluate frozen regime-research-v1 market-state targets before strategy PnL
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-market-state-scan "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/market_state.json
      - name: Recover cumulative validated discovery ledger
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/discovery_previous /tmp/discovery_migration
          mkdir -p /tmp/discovery_previous /tmp/discovery_migration artifacts/orderflow/history
          PREV_ID=""
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID; do
            [[ -z "${ARTIFACT_ID:-}" || -z "${RUN_ID:-}" ]] && continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)"
            if [[ "$CONCLUSION" == "success" ]]; then
              PREV_ID="$ARTIFACT_ID"
              break
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=orderflow-discovery-ledger-v1&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[] | [.id, .workflow_run.id] | @tsv' || true)

          if [[ -n "$PREV_ID" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}/zip" > /tmp/discovery_previous.zip
            unzip -q /tmp/discovery_previous.zip -d /tmp/discovery_previous
            PRIOR_HISTORY="$(find /tmp/discovery_previous -type d -path '*/artifacts/orderflow/history' -print -quit || true)"
            if [[ -n "$PRIOR_HISTORY" ]]; then
              cp -a "$PRIOR_HISTORY"/. artifacts/orderflow/history/
            fi
          else
            # One-time migration of validated compact reports into the cumulative ledger.
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=orderflow-discovery-report&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[].workflow_run.id' \
              | sort -u > /tmp/discovery_migration_run_ids.txt
            while read -r RUN_ID; do
              test -n "$RUN_ID" || continue
              CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)"
              [[ "$CONCLUSION" == "success" ]] || continue
              DEST="/tmp/discovery_migration/${RUN_ID}"
              mkdir -p "$DEST"
              gh run download "$RUN_ID" --name orderflow-discovery-report --dir "$DEST" || { rm -rf "$DEST"; continue; }
              SRC="$(find "$DEST" -type f -name market_state.json -printf '%h\n' | head -n 1 || true)"
              [[ -n "$SRC" ]] || continue
              BATCH="migration_${RUN_ID}"
              mkdir -p "artifacts/orderflow/history/${BATCH}"
              for F in market_state.json state_candidate_registry_v1.json conditioned_experiment_v1.json backtest.json conditions.json direction_pair.json stop_risk.json; do
                [[ -f "$SRC/$F" ]] && cp "$SRC/$F" "artifacts/orderflow/history/${BATCH}/$F"
              done
            done < /tmp/discovery_migration_run_ids.txt
          fi
      - name: Aggregate market-state evidence by independent capture batch before strategy PnL
        shell: bash
        run: |
          STATE_REPORTS=(artifacts/orderflow/market_state.json)
          while IFS= read -r REPORT; do
            STATE_REPORTS+=("$REPORT")
          done < <(find artifacts/orderflow/history -type f -name market_state.json | sort)
          orderflow-market-state-aggregate "${STATE_REPORTS[@]}" \
            --minimum-independent-batches 3 \
            --minimum-positive-batch-fraction 0.6666666666666666 \
            --minimum-association-observations 20 \
            --redundancy-abs-spearman-threshold 0.80 \
            --output artifacts/orderflow/market_state_aggregate.json

          orderflow-market-state-aggregate-v1-1 "${STATE_REPORTS[@]}" \
            --protocol config/regime_research_v1_1.json \
            --output artifacts/orderflow/market_state_aggregate_v1_1.json

          orderflow-market-state-aggregate-v1-2 "${STATE_REPORTS[@]}" \
            --protocol config/regime_research_v1_2.json \
            --output artifacts/orderflow/market_state_aggregate_v1_2.json
      - name: Publish PnL-independent state promotion reports
        shell: bash
        run: |
          orderflow-state-promotion-report \
            artifacts/orderflow/market_state_aggregate_v1_1.json \
            --output artifacts/orderflow/state_promotion_report.json
          orderflow-state-promotion-report-v1-2 \
            artifacts/orderflow/market_state_aggregate_v1_2.json \
            --output artifacts/orderflow/state_promotion_report_v1_2.json
      - name: Lock at most one PnL-independent state candidate before strategy PnL
        shell: bash
        run: |
          REGISTRY_ARGS=()
          while IFS= read -r REGISTRY; do
            REGISTRY_ARGS+=(--prior-registry "$REGISTRY")
          done < <(find artifacts/orderflow/history -type f -name state_candidate_registry_v1.json | sort)
          orderflow-state-candidate-registry-v1 \
            artifacts/orderflow/state_promotion_report_v1_2.json \
            --protocol config/state_candidate_registry_v1.json \
            "${REGISTRY_ARGS[@]}" \
            --output artifacts/orderflow/state_candidate_registry_v1.json
      - name: Bind conditioning freeze to deterministic state candidate before strategy PnL
        shell: bash
        run: |
          orderflow-strategy-conditioning-registry-binding-v1 \
            artifacts/orderflow/market_state_aggregate_v1_2.json \
            artifacts/orderflow/state_candidate_registry_v1.json \
            --binding-protocol config/strategy_conditioning_registry_binding_v1.json \
            --conditioning-protocol config/strategy_conditioning_v1_1.json \
            --output artifacts/orderflow/strategy_conditioning_registry_binding_v1.json
      - name: Freeze PnL-independent market-state thresholds before strategy PnL
        shell: bash
        run: |
          STATE_REPORTS=(artifacts/orderflow/market_state.json)
          while IFS= read -r REPORT; do
            STATE_REPORTS+=("$REPORT")
          done < <(find artifacts/orderflow/history -type f -name market_state.json | sort)
          orderflow-state-threshold-freeze-v1 \
            artifacts/orderflow/market_state_aggregate_v1_2.json \
            artifacts/orderflow/strategy_conditioning_registry_binding_v1.json \
            "${STATE_REPORTS[@]}" \
            --protocol config/state_threshold_freeze_v1.json \
            --output artifacts/orderflow/state_threshold_freeze_v1.json
      - name: Freeze PnL-independent strategy-state bucket mapping before strategy PnL
        shell: bash
        run: |
          orderflow-strategy-state-mapping-v1 \
            artifacts/orderflow/state_threshold_freeze_v1.json \
            --protocol config/strategy_state_mapping_v1.json \
            --output artifacts/orderflow/strategy_state_mapping_v1.json
      - name: Run frozen discovery-v1 backtest and pre-registered condition analysis
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-backtest "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/backtest.json
          orderflow-market-conditions "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/conditions.json
      - name: Run paired directional control and stop-based risk experiment
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-direction-pair "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/direction_pair.json
          orderflow-stop-risk "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/stop_risk.json
      - name: Run frozen baseline versus conditioned research experiment
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-conditioned-experiment-v1 \
            "$FEATURE" \
            artifacts/orderflow/market_state.json \
            artifacts/orderflow/strategy_state_mapping_v1.json \
            --output artifacts/orderflow/conditioned_experiment_v1.json
      - name: Append current validated reports to cumulative ledger
        shell: bash
        run: |
          set -euo pipefail
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          BATCH_ID=$(basename "$FEATURE" _mexc_features.jsonl)
          DEST="artifacts/orderflow/history/${BATCH_ID}"
          mkdir -p "$DEST"
          for F in market_state.json state_candidate_registry_v1.json conditioned_experiment_v1.json backtest.json conditions.json direction_pair.json stop_risk.json; do
            test -f "artifacts/orderflow/$F"
            cp "artifacts/orderflow/$F" "$DEST/$F"
          done
      - name: Aggregate conditioned results by overlap-aware dependence cluster
        shell: bash
        run: |
          mapfile -t CONDITIONED_REPORTS < <(find artifacts/orderflow/history -type f -name conditioned_experiment_v1.json | sort)
          test "${#CONDITIONED_REPORTS[@]}" -ge 1
          STATE_ARGS=()
          while IFS= read -r REPORT; do
            STATE_ARGS+=(--state-report "$REPORT")
          done < <(find artifacts/orderflow/history -type f -name market_state.json | sort)
          orderflow-conditioned-result-aggregate-v1 \
            "${CONDITIONED_REPORTS[@]}" \
            "${STATE_ARGS[@]}" \
            --protocol config/conditioned_result_aggregate_v1.json \
            --regime-protocol config/regime_research_v1_2.json \
            --output artifacts/orderflow/conditioned_result_aggregate_v1.json
      - name: Aggregate strategy discovery evidence by independent capture batch
        shell: bash
        run: |
          mapfile -t REPORTS < <(find artifacts/orderflow/history -type f -name backtest.json | sort)
          test "${#REPORTS[@]}" -ge 1
          orderflow-discovery-aggregate "${REPORTS[@]}" \
            --protocol config/orderflow_discovery_v1.json \
            --output artifacts/orderflow/discovery_aggregate.json

          mapfile -t CONDITION_REPORTS < <(find artifacts/orderflow/history -type f -name conditions.json | sort)
          test "${#CONDITION_REPORTS[@]}" -ge 1
          orderflow-condition-aggregate "${CONDITION_REPORTS[@]}" \
            --output artifacts/orderflow/condition_aggregate.json
      - name: Write cumulative ledger manifest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('artifacts/orderflow/history')
          batches=sorted(p.name for p in root.iterdir() if p.is_dir()) if root.exists() else []
          payload={
              'schema_version': 1,
              'ledger': 'orderflow-discovery-ledger-v1',
              'updated_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'batch_count': len(batches),
              'batches': batches,
              'raw_replay_retained_for_this_run': '${{ steps.retention.outputs.keep_raw }}' == 'true',
              'claims': {
                  'verified_out_of_sample_edge_established': False,
                  'profitable_edge_established': False,
                  'live_order_transmission_supported': False,
              },
          }
          Path('artifacts/orderflow/discovery_ledger_manifest.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
      - name: Preserve cumulative validated discovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-discovery-ledger-v1
          path: |
            artifacts/orderflow/history/
            artifacts/orderflow/discovery_ledger_manifest.json
            artifacts/orderflow/market_state_aggregate_v1_2.json
            artifacts/orderflow/state_promotion_report_v1_2.json
            artifacts/orderflow/conditioned_result_aggregate_v1.json
            artifacts/orderflow/discovery_aggregate.json
            artifacts/orderflow/condition_aggregate.json
            config/regime_research_v1_2.json
            config/orderflow_discovery_v1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Delete superseded cumulative discovery-ledger artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IDS < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=orderflow-discovery-ledger-v1&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[1:] | .[].id' || true)
          for ID in "${IDS[@]}"; do
            [[ -z "$ID" ]] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" || true
          done
      - name: Preserve compact discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-discovery-report
          path: |
            artifacts/orderflow/market_state.json
            artifacts/orderflow/market_state_aggregate.json
            artifacts/orderflow/market_state_aggregate_v1_1.json
            artifacts/orderflow/market_state_aggregate_v1_2.json
            artifacts/orderflow/state_promotion_report.json
            artifacts/orderflow/state_promotion_report_v1_2.json
            artifacts/orderflow/state_candidate_registry_v1.json
            artifacts/orderflow/strategy_conditioning_registry_binding_v1.json
            artifacts/orderflow/state_threshold_freeze_v1.json
            artifacts/orderflow/strategy_state_mapping_v1.json
            artifacts/orderflow/conditioned_experiment_v1.json
            artifacts/orderflow/conditioned_result_aggregate_v1.json
            artifacts/orderflow/backtest.json
            artifacts/orderflow/direction_pair.json
            artifacts/orderflow/stop_risk.json
            artifacts/orderflow/conditions.json
            artifacts/orderflow/discovery_aggregate.json
            artifacts/orderflow/condition_aggregate.json
            artifacts/orderflow/discovery_ledger_manifest.json
            config/regime_research_v1.json
            config/regime_research_v1_1.json
            config/regime_research_v1_2.json
            config/state_candidate_registry_v1.json
            config/strategy_conditioning_v1_1.json
            config/strategy_conditioning_registry_binding_v1.json
            config/state_threshold_freeze_v1.json
            config/strategy_state_mapping_v1.json
            config/conditioned_result_aggregate_v1.json
            config/orderflow_discovery_v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve deterministic raw discovery replay sample
        if: always() && steps.retention.outputs.keep_raw == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-discovery-replay-${{ github.run_id }}
          path: |
            artifacts/orderflow/*_mexc_raw.jsonl*
            artifacts/orderflow/*_mexc_features.jsonl*
          if-no-files-found: warn
          retention-days: 5
