name: Continuous Order-Flow Discovery

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-orderflow-discovery
  cancel-in-progress: false

jobs:
  capture-and-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Capture 15 minutes of fresh public ENA/BTC order flow
        run: |
          mkdir -p artifacts/orderflow
          orderflow-mexc-record \
            --symbol ENA_USDT \
            --symbol BTC_USDT \
            --duration-seconds 900 \
            --output-dir artifacts/orderflow
      - name: Evaluate frozen regime-research-v1 market-state targets before strategy PnL
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-market-state-scan "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/market_state.json
      - name: Download prior discovery reports
        shell: bash
        run: |
          mkdir -p prior
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=orderflow-discovery-report&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[:47] | .[].workflow_run.id' \
            | sort -u > prior_run_ids.txt
          while read -r RUN_ID; do
            test -n "$RUN_ID" || continue
            mkdir -p "prior/$RUN_ID"
            gh run download "$RUN_ID" \
              --name orderflow-discovery-report \
              --dir "prior/$RUN_ID" \
              || rm -rf "prior/$RUN_ID"
          done < prior_run_ids.txt
      - name: Aggregate market-state evidence by independent capture batch before strategy PnL
        shell: bash
        run: |
          STATE_REPORTS=(artifacts/orderflow/market_state.json)
          while IFS= read -r REPORT; do
            STATE_REPORTS+=("$REPORT")
          done < <(find prior -type f -name market_state.json | sort)
          orderflow-market-state-aggregate "${STATE_REPORTS[@]}" \
            --minimum-independent-batches 3 \
            --minimum-positive-batch-fraction 0.6666666666666666 \
            --minimum-association-observations 20 \
            --redundancy-abs-spearman-threshold 0.80 \
            --output artifacts/orderflow/market_state_aggregate.json

          orderflow-market-state-aggregate-v1-1 "${STATE_REPORTS[@]}" \
            --protocol config/regime_research_v1_1.json \
            --output artifacts/orderflow/market_state_aggregate_v1_1.json
      - name: Publish PnL-independent state promotion report
        shell: bash
        run: |
          orderflow-state-promotion-report \
            artifacts/orderflow/market_state_aggregate_v1_1.json \
            --output artifacts/orderflow/state_promotion_report.json
      - name: Run frozen discovery-v1 backtest and pre-registered condition analysis
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-backtest "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/backtest.json
          orderflow-market-conditions "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/conditions.json
      - name: Run paired directional control and stop-based risk experiment
        shell: bash
        run: |
          FEATURE=$(find artifacts/orderflow -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          orderflow-direction-pair "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/direction_pair.json
          orderflow-stop-risk "$FEATURE" \
            --symbol ENA_USDT \
            --context-symbol BTC_USDT \
            --output artifacts/orderflow/stop_risk.json
      - name: Aggregate strategy discovery evidence by independent capture batch
        shell: bash
        run: |
          REPORTS=(artifacts/orderflow/backtest.json)
          while IFS= read -r REPORT; do
            REPORTS+=("$REPORT")
          done < <(find prior -type f -name backtest.json | sort)
          orderflow-discovery-aggregate "${REPORTS[@]}" \
            --protocol config/orderflow_discovery_v1.json \
            --output artifacts/orderflow/discovery_aggregate.json

          CONDITION_REPORTS=(artifacts/orderflow/conditions.json)
          while IFS= read -r REPORT; do
            CONDITION_REPORTS+=("$REPORT")
          done < <(find prior -type f -name conditions.json | sort)
          orderflow-condition-aggregate "${CONDITION_REPORTS[@]}" \
            --output artifacts/orderflow/condition_aggregate.json
      - name: Preserve compact discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-discovery-report
          path: |
            artifacts/orderflow/market_state.json
            artifacts/orderflow/market_state_aggregate.json
            artifacts/orderflow/market_state_aggregate_v1_1.json
            artifacts/orderflow/state_promotion_report.json
            artifacts/orderflow/backtest.json
            artifacts/orderflow/direction_pair.json
            artifacts/orderflow/stop_risk.json
            artifacts/orderflow/conditions.json
            artifacts/orderflow/discovery_aggregate.json
            artifacts/orderflow/condition_aggregate.json
            config/regime_research_v1.json
            config/regime_research_v1_1.json
            config/orderflow_discovery_v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve short-lived raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-discovery-evidence-${{ github.run_id }}
          path: |
            artifacts/orderflow/*_mexc_raw.jsonl*
            artifacts/orderflow/*_mexc_features.jsonl*
          if-no-files-found: warn
          retention-days: 2
