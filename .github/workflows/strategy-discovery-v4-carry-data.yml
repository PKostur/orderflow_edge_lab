name: Strategy Discovery v4 Carry Data

on:
  workflow_dispatch:
  push:
    branches: [research/strategy-discovery-v4-carry]
    paths:
      - "config/strategy_discovery_v4_carry.json"
      - "scripts/prepare_strategy_discovery_v4_carry_data.py"
      - ".github/workflows/strategy-discovery-v4-carry-data.yml"

permissions:
  contents: read

concurrency:
  group: strategy-discovery-v4-carry-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]" requests
      - name: Fetch frozen spot, perpetual and funding histories
        run: |
          python scripts/prepare_strategy_discovery_v4_carry_data.py \
            --config config/strategy_discovery_v4_carry.json \
            --output-dir artifacts/strategy_discovery_v4_carry/data \
            --max-workers 3
      - name: Preserve immutable dataset
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v4-carry-data
          path: artifacts/strategy_discovery_v4_carry/data/
          retention-days: 30
          if-no-files-found: error
