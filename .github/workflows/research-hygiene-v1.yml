name: Research Hygiene v1

# Mechanical contract checks over the research repository:
#   * every prospective watch's pre-registration status (recorded, never patched)
#   * frozen definitions still matching config/frozen_manifest_v1.json
#   * every artifact a workflow consumes having a producer
#   * the hypothesis-inspection registry being intact
#
# This job changes nothing. It does not count evidence, compute a verdict or
# promote anything; it fails when a contract that protects the research record
# has been broken.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Run the hygiene audit
        id: audit
        run: |
          set -o pipefail
          orderflow-research-hygiene \
            --repo-root . \
            --output artifacts/hygiene.json \
            --markdown artifacts/hygiene.md \
            | tee artifacts/hygiene_stdout.txt
      - name: Assert the report is reporting-only
        run: |
          python - <<'PY'
          import json
          report = json.load(open('artifacts/hygiene.json', encoding='utf-8'))
          claims = report['claims']
          assert claims['changes_frozen_definitions'] is False, 'audit claims to change definitions'
          assert claims['computes_strategy_verdicts'] is False, 'audit claims to compute verdicts'
          assert claims['promotes_strategy'] is False, 'audit claims to promote'
          assert claims['live_order_transmission_supported'] is False, 'audit claims live support'
          print('hygiene_ok', report['hygiene_ok'])
          print('component_ok', json.dumps(report['component_ok'], sort_keys=True))
          print('findings', json.dumps(report['finding_counts'], sort_keys=True))
          print('report_sha256', report['report_sha256'])
          PY
      - name: Publish step summary
        if: always()
        run: |
          if [ -f artifacts/hygiene.md ]; then
            cat artifacts/hygiene.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'hygiene report was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-hygiene-v1
          path: |
            artifacts/hygiene.json
            artifacts/hygiene.md
            artifacts/hygiene_stdout.txt
          if-no-files-found: warn
          retention-days: 90
