name: Universal Shadow Operational Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "src/orderflow_edge_lab/universal_shadow_operational_monitor.py"
      - "src/orderflow_edge_lab/cli/universal_shadow_operational_monitor.py"
      - "tests/test_universal_shadow_operational_monitor.py"
      - ".github/workflows/universal-shadow-operational-monitor.yml"
      - "pyproject.toml"
  schedule:
    - cron: "55 0,8,16 * * *"

permissions:
  contents: read

concurrency:
  group: universal-shadow-operational-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run operational monitor tests
        run: python -m unittest tests.test_universal_shadow_operational_monitor -v
      - name: Build operational monitor
        run: |
          mkdir -p artifacts/universal_shadow_operational_monitor
          orderflow-universal-shadow-monitor \
            --config config/universal_session_alignment_shadow_v1.json \
            --output artifacts/universal_shadow_operational_monitor/report.json \
            --max-workers 5
      - name: Enforce operational-only boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/universal_shadow_operational_monitor/report.json",encoding="utf-8"))
          c=r["claims"]
          required=("operational_only","not_prospective_evidence","does_not_change_frozen_shadow","does_not_change_strategy_rules","does_not_affect_jev_v1_decision_contract")
          if not all(bool(c.get(k)) for k in required):
              raise SystemExit("operational monitor boundary claim failed")
          if bool(c.get("live_trading_authorized")) or bool(c.get("leverage_authorized")):
              raise SystemExit("operational monitor exceeded authority")
          print(json.dumps({
              "as_of_utc":r["as_of_utc"],
              "latest_execution_boundary_utc":r["latest_execution_boundary_utc"],
              "execution_boundaries_since_start_including_start":r["execution_boundaries_since_start_including_start"],
              "strategies":{
                  x["audit_id"]:{
                      "current_nonzero_symbol_count":x["current_nonzero_symbol_count"],
                      "carried_pre_start_position_count":x["carried_pre_start_position_count"],
                      "post_start_position_change_count":x["post_start_position_change_count"],
                      "symbols_with_post_start_change":x["symbols_with_post_start_change"],
                  }
                  for x in r["strategies"]
              },
          },indent=2))
          PY
      - name: Preserve operational monitor artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-shadow-operational-monitor
          path: artifacts/universal_shadow_operational_monitor/
          retention-days: 90
          if-no-files-found: error
