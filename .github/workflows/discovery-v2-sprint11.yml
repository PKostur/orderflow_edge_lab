name: Discovery v2 Sprint 11 Selective

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint11-selective]
    paths:
      - 'config/discovery_v2_sprint11_selective_v1.json'
      - 'src/orderflow_edge_lab/discovery_v2_sprint11.py'
      - 'scripts/discovery_v2_sprint11.py'
      - 'tests/test_discovery_v2_sprint11.py'
      - '.github/workflows/discovery-v2-sprint11.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run Sprint 11 guardrails before market data
        run: python -m pytest -q tests/test_discovery_v2_sprint11.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen Sprint 11 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_sprint11_selective_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_MARKET_RESULTS'
          assert p['execution']['leverage']==1.0
          assert p['trial_accounting']['directional_candidate_variants_added_this_sprint']==3
          assert p['opportunity_gate']['quality_percentile']==0.75
          assert p['opportunity_gate']['no_threshold_grid'] is True
          assert p['d0_research_candidate_gate']['bootstrap_95pct_lower_bound']=='diagnostic_only_at_D0'
          assert p['post_freeze_validation_gate']['bootstrap_95pct_lower_bound_positive'] is True
          assert p['claims']['persistent_edge_established'] is False
          print('Frozen Sprint 11 selective contract verified.')
          PY
      - name: Run frozen D0 selective discovery sprint
        run: python scripts/discovery_v2_sprint11.py --protocol config/discovery_v2_sprint11_selective_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint11/results
      - name: Enforce result-state boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint11/results/sprint11_report.json').read_text())
          assert r['protocol_freeze_commit']=='c48623ce31bc1f5032635049f0a69f457e55af82'
          assert r['independence_level']=='D0_SELECTIVE_DISCOVERY'
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_execution_supported'] is False
          for name,f in r['families'].items():
              assert f['state'] in {'FALSIFIED','RESEARCH_CANDIDATE_FREEZE_PENDING'},(name,f['state'])
          print({k:v['state'] for k,v in r['families'].items()})
          PY
      - name: Upload immutable Sprint 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint11-selective-v1
          path: |
            config/discovery_v2_sprint11_selective_v1.json
            research/discovery_v2/sprint11/results/
          retention-days: 30
          if-no-files-found: warn
