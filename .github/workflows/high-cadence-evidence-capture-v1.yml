name: High-Cadence Market Evidence Capture v1

on:
  pull_request:
    branches: [main]
    paths:
      - "config/high_cadence_evidence_capture_v1.json"
      - ".github/workflows/high-cadence-evidence-capture-v1.yml"
  workflow_dispatch:
  schedule:
    - cron: "2,32 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: high-cadence-market-evidence-capture-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Verify frozen capture-only protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('config/high_cadence_evidence_capture_v1.json', encoding='utf-8'))
          assert p['protocol_name'] == 'high-cadence-evidence-capture-v1'
          assert p['capture']['duration_seconds'] == 900
          assert p['capture']['target_cadence_minutes'] == 30
          assert p['validity']['capture_only'] is True
          assert p['validity']['strategy_pnl_used_for_collection'] is False
          assert p['validity']['cross_symbol_rows_from_the_same_time_batch_are_not_independent_time_trials'] is True
          assert p['claims']['profitable_edge_established'] is False
          assert p['claims']['live_order_transmission_supported'] is False
          PY
      - name: Capture fixed 10-symbol public MEXC panel for 15 minutes
        run: |
          mkdir -p artifacts/high_cadence
          orderflow-mexc-record \
            --symbol BTC_USDT \
            --symbol ETH_USDT \
            --symbol SOL_USDT \
            --symbol XRP_USDT \
            --symbol DOGE_USDT \
            --symbol BNB_USDT \
            --symbol ADA_USDT \
            --symbol LINK_USDT \
            --symbol SUI_USDT \
            --symbol ENA_USDT \
            --duration-seconds 900 \
            --output-dir artifacts/high_cadence
      - name: Produce PnL-independent state reports for every non-BTC symbol
        shell: bash
        run: |
          set -euo pipefail
          FEATURE=$(find artifacts/high_cadence -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          BATCH_ID=$(basename "$FEATURE" _mexc_features.jsonl)
          for SYMBOL in ETH_USDT SOL_USDT XRP_USDT DOGE_USDT BNB_USDT ADA_USDT LINK_USDT SUI_USDT ENA_USDT; do
            orderflow-market-state-scan "$FEATURE" \
              --symbol "$SYMBOL" \
              --context-symbol BTC_USDT \
              --batch-id "$BATCH_ID" \
              --output "artifacts/high_cadence/market_state_${SYMBOL}.json"
          done
      - name: Recover prior compact high-cadence state evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prior_state /tmp/high_cadence_state_zips
          mkdir -p prior_state /tmp/high_cadence_state_zips
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("high-cadence-state-")))) | sort_by(.created_at) | reverse | .[:47] | .[].id' \
            > prior_state_artifact_ids.txt
          while read -r ARTIFACT_ID; do
            test -n "$ARTIFACT_ID" || continue
            ZIP="/tmp/high_cadence_state_zips/${ARTIFACT_ID}.zip"
            DEST="prior_state/${ARTIFACT_ID}"
            mkdir -p "$DEST"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ZIP" 2>/dev/null; then
              unzip -q "$ZIP" -d "$DEST" || rm -rf "$DEST"
            else
              rm -rf "$DEST"
            fi
          done < prior_state_artifact_ids.txt
      - name: Aggregate each symbol by overlap-aware dependence cluster before strategy PnL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/high_cadence/aggregates
          for SYMBOL in ETH_USDT SOL_USDT XRP_USDT DOGE_USDT BNB_USDT ADA_USDT LINK_USDT SUI_USDT ENA_USDT; do
            REPORTS=("artifacts/high_cadence/market_state_${SYMBOL}.json")
            while IFS= read -r REPORT; do
              REPORTS+=("$REPORT")
            done < <(find prior_state -type f -name "market_state_${SYMBOL}.json" | sort)
            orderflow-market-state-aggregate-v1-2 "${REPORTS[@]}" \
              --protocol config/regime_research_v1_2.json \
              --output "artifacts/high_cadence/aggregates/market_state_aggregate_v1_2_${SYMBOL}.json"
            orderflow-state-promotion-report-v1-2 \
              "artifacts/high_cadence/aggregates/market_state_aggregate_v1_2_${SYMBOL}.json" \
              --output "artifacts/high_cadence/aggregates/state_promotion_report_v1_2_${SYMBOL}.json"
          done
      - name: Write immutable capture manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('artifacts/high_cadence')
          files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({
                      'name': str(p.relative_to(root)),
                      'bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  })
          protocol=Path('config/high_cadence_evidence_capture_v1.json')
          payload={
              'schema_version': 1,
              'protocol_name': 'high-cadence-evidence-capture-v1',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'protocol_sha256': hashlib.sha256(protocol.read_bytes()).hexdigest(),
              'files': files,
              'claims': {
                  'strategy_pnl_used_for_collection': False,
                  'profitable_edge_established': False,
                  'live_order_transmission_supported': False,
              },
          }
          (root/'capture_manifest.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
      - name: Deterministic release-manager integrity check
        run: |
          orderflow-multi-agent --output artifacts/high_cadence/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/high_cadence/multi_agent_report.json', encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked evidence capture')
          PY
      - name: Preserve compact high-cadence state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-cadence-state-${{ github.run_id }}
          path: |
            artifacts/high_cadence/market_state_*.json
            artifacts/high_cadence/aggregates/
            artifacts/high_cadence/capture_manifest.json
            artifacts/high_cadence/multi_agent_report.json
            config/high_cadence_evidence_capture_v1.json
            config/regime_research_v1_2.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve raw high-cadence market evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-cadence-market-evidence-${{ github.run_id }}
          path: |
            artifacts/high_cadence/*_mexc_raw.jsonl*
            artifacts/high_cadence/*_mexc_features.jsonl*
          retention-days: 14
          if-no-files-found: error
