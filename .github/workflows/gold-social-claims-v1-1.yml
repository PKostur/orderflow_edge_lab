name: Gold Social Claims v1.1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-social-claims-v1-1]
    paths:
      - "config/gold_social_claims_v1_1.json"
      - "scripts/run_gold_social_claims_v1_1.py"
      - ".github/workflows/gold-social-claims-v1-1.yml"

permissions:
  contents: read

concurrency:
  group: gold-social-claims-v1-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Fetch XAUUSD and XAGUSD frozen histories
        run: |
          mkdir -p artifacts/gold_social_claims_v1_1/data
          g="https://raw.githubusercontent.com/simom1/XAUUSD-history/main/Gold-Cash/XAUUSD"
          s="https://raw.githubusercontent.com/simom1/XAUUSD-history/main/Silver-Cash/XAGUSD"
          curl -fL --retry 3 "$g/XAUUSD_M1_2020_2022.csv" -o artifacts/gold_social_claims_v1_1/data/XAUUSD_M1_2020_2022.csv
          curl -fL --retry 3 "$g/XAUUSD_M1_2023_2026.csv" -o artifacts/gold_social_claims_v1_1/data/XAUUSD_M1_2023_2026.csv
          curl -fL --retry 3 "$g/XAUUSD_M15_2010_2026.csv" -o artifacts/gold_social_claims_v1_1/data/XAUUSD_M15_2010_2026.csv
          curl -fL --retry 3 "$g/XAUUSD_H1_2010_2026.csv" -o artifacts/gold_social_claims_v1_1/data/XAUUSD_H1_2010_2026.csv
          curl -fL --retry 3 "$s/XAGUSD_M15.csv" -o artifacts/gold_social_claims_v1_1/data/XAGUSD_M15.csv
          curl -fL --retry 3 "$s/XAGUSD_H1.csv" -o artifacts/gold_social_claims_v1_1/data/XAGUSD_H1.csv
          sha256sum artifacts/gold_social_claims_v1_1/data/*.csv > artifacts/gold_social_claims_v1_1/data/SHA256SUMS.txt
      - name: Run development-only social claims tournament
        run: |
          python scripts/run_gold_social_claims_v1_1.py \
            --data-dir artifacts/gold_social_claims_v1_1/data \
            --output artifacts/gold_social_claims_v1_1/development_results.json
      - name: Keep holdout sealed and claims conservative
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_social_claims_v1_1/development_results.json'))
          if r['holdout_opened']:
              raise SystemExit('holdout was opened')
          if any(r['claims'].values()):
              raise SystemExit(f"claim escalation forbidden: {r['claims']}")
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-social-claims-v1-1-development
          path: artifacts/gold_social_claims_v1_1/
          retention-days: 30
          if-no-files-found: error
