name: Basis Convergence V1

on:
  pull_request:
    paths:
      - 'config/basis_convergence_v1.json'
      - 'scripts/run_basis_convergence_v1.py'
      - '.github/workflows/basis-convergence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas scipy
      - name: Compile evaluator
        run: python -m py_compile scripts/run_basis_convergence_v1.py
      - name: Validate frozen protocol
        run: |
          python - <<'PY'
          import json
          c=json.load(open('config/basis_convergence_v1.json'))
          assert c['outcomes_inspected_before_freeze'] is False
          assert c['state_layer']['required_before_strategy_pnl'] is True
          assert c['strategy_translation']['allowed_only_after_state_pass'] is True
          assert c['strategy_translation']['funding']['history_must_cover_entire_symbol_study_period'] is True
          assert c['screening_gate']['requires_parameter_neighborhood_support'] is True
          assert c['orthogonality']['no_second_indicator_in_v1'] is True
          assert c['promotion']['automatic_live_transmission'] is False
          PY
      - name: Run frozen basis convergence development screen
        run: python scripts/run_basis_convergence_v1.py --out research/basis_convergence_v1
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: basis-convergence-v1
          path: research/basis_convergence_v1/
