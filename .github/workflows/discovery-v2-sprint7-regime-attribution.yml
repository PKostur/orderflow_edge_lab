name: Discovery v2 Sprint 7 Regime Attribution

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint7]
    paths:
      - 'config/discovery_v2_regime_attribution_sprint7_v1.json'
      - '.github/workflows/discovery-v2-sprint7-regime-attribution.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint7-regime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Verify inherited regime classifier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_regime_attribution_sprint7_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_REGIME_RESULTS'
          assert p['classifier_provenance']['original_freeze_commit']=='53649bf6f2cdada0480af4f34a3221462bba0d66'
          assert p['classifier_provenance']['classifier_changed_for_sprint7'] is False
          assert p['state_timing']['future_pnl_used_in_state'] is False
          assert p['state_timing']['execution_day_open_or_later_used_in_state'] is False
          assert p['claims']['regime_winner_is_promotable'] is False
          print('Inherited regime classifier verified.')
          PY
      - name: Reproduce frozen Sprint 7 D0 series
        run: python scripts/discovery_v2_sprint7.py --protocol config/discovery_v2_sprint7_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint7/results
      - name: Run diagnostic regime attribution
        run: python scripts/discovery_v2_regime_attribution.py --protocol config/discovery_v2_regime_attribution_sprint7_v1.json --results-root research/discovery_v2/sprint7/results --output-dir research/discovery_v2/sprint7/regime_attribution
      - name: Enforce diagnostic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint7/regime_attribution/regime_attribution.json').read_text())
          assert r['status']=='DIAGNOSTIC_COMPLETE'
          assert r['claims']['regime_attribution_is_validation'] is False
          assert r['claims']['regime_winner_is_promotable'] is False
          assert r['claims']['router_supported'] is False
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_execution_supported'] is False
          print(r['regime_winners'])
          PY
      - name: Upload immutable regime diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint7-regime-attribution-v1
          path: |
            config/discovery_v2_regime_attribution_sprint7_v1.json
            research/discovery_v2/sprint7/regime_attribution/
          retention-days: 30
          if-no-files-found: error
