name: Gold Strategy Discovery v1.1 Community

on:
  workflow_dispatch:
  push:
    branches: [research/gold-strategy-discovery-v1-1-community]
    paths:
      - "config/gold_strategy_discovery_v1_1_community.json"
      - "scripts/run_gold_strategy_discovery_v1_1.py"
      - ".github/workflows/gold-strategy-discovery-v1-1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gold-strategy-discovery-v1-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy
      - name: Download exact preserved XAUUSD dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-strategy-discovery-v1-development
          path: artifacts/gold_strategy_discovery_v1
          github-token: ${{ github.token }}
          repository: PKostur/orderflow_edge_lab
          run-id: 34877800446
      - name: Verify exact preserved source data
        run: |
          test -f artifacts/gold_strategy_discovery_v1/data/SHA256SUMS.txt
          sha256sum -c artifacts/gold_strategy_discovery_v1/data/SHA256SUMS.txt
      - name: Run development-only community tournament
        run: |
          python scripts/run_gold_strategy_discovery_v1_1.py \
            --data-dir artifacts/gold_strategy_discovery_v1/data \
            --output artifacts/gold_strategy_discovery_v1_1/development_results.json
      - name: Guard evidence boundary
        run: |
          python - <<'PY'
          import json
          p='artifacts/gold_strategy_discovery_v1_1/development_results.json'
          r=json.load(open(p, encoding='utf-8'))
          if r['holdout_opened']:
              raise SystemExit('locked holdout must remain sealed')
          if any(r['claims'].values()):
              raise SystemExit(f"claim escalation: {r['claims']}")
          if r['trial_count'] < 100:
              raise SystemExit(f"unexpectedly small frozen trial ledger: {r['trial_count']}")
          print({k:r[k] for k in ['trial_count','error_count','prelim_pass_count','holdout_opened']})
          PY
      - name: Deterministic release-manager guard
        run: |
          python -m pip install -e ".[research]"
          orderflow-multi-agent --output artifacts/gold_strategy_discovery_v1_1/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_strategy_discovery_v1_1/multi_agent_report.json', encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit(r['release_manager']['next_actions'])
          PY
      - name: Preserve v1.1 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-strategy-discovery-v1-1-community-development
          path: artifacts/gold_strategy_discovery_v1_1/
          retention-days: 30
          if-no-files-found: error
