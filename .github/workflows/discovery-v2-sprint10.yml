name: Discovery v2 Sprint 10 Literature

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint10-literature]
    paths:
      - 'config/discovery_v2_sprint10_literature_v1.json'
      - 'src/orderflow_edge_lab/discovery_v2_sprint10.py'
      - 'scripts/discovery_v2_sprint10.py'
      - 'tests/test_discovery_v2_sprint10.py'
      - '.github/workflows/discovery-v2-sprint10.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run Sprint 10 guardrails before market data
        run: python -m pytest -q tests/test_discovery_v2_sprint10.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen Sprint 10 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_sprint10_literature_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_MARKET_RESULTS'
          assert p['execution']['leverage']==1.0
          assert p['trial_accounting']['directional_candidate_variants_added_this_sprint']==12
          assert p['trial_accounting']['published_direction_does_not_relax_internal_gates'] is True
          assert p['data']['no_2025_data_for_discovery'] is True
          assert p['claims']['paper_replication_claimed'] is False
          assert p['claims']['persistent_edge_established'] is False
          print('Frozen Sprint 10 contract verified.')
          PY
      - name: Run frozen D0 literature-transfer sprint
        run: python scripts/discovery_v2_sprint10.py --protocol config/discovery_v2_sprint10_literature_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint10/results
      - name: Enforce result-state boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint10/results/sprint10_report.json').read_text())
          assert r['protocol_freeze_commit']=='715c8ebe5dab957e4dd6bfad7b6fb9931cf47c42'
          assert r['independence_level']=='D0_LITERATURE_TRANSFER'
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['paper_replication_claimed'] is False
          for name,f in r['families'].items(): assert f['state'] in {'FALSIFIED','REPLICATION_PENDING'},(name,f['state'])
          print({k:v['state'] for k,v in r['families'].items()})
          PY
      - name: Upload immutable Sprint 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint10-literature-v1
          path: |
            config/discovery_v2_sprint10_literature_v1.json
            research/discovery_v2/sprint10/results/
          retention-days: 30
          if-no-files-found: warn
