name: Strategy Discovery v4.2 Funding Generalization

on:
  workflow_dispatch:
  push:
    branches: [research/strategy-discovery-v4-2-funding-generalization]
    paths:
      - "config/strategy_discovery_v4_2_funding_generalization.json"
      - "config/strategy_discovery_v4_2_1_funding_generalization_implementation.json"
      - "config/strategy_discovery_v4_2_2_combined_diagnostic.json"
      - "scripts/prepare_strategy_discovery_v4_2_funding_generalization.py"
      - "scripts/run_strategy_discovery_v4_2_funding_generalization.py"
      - ".github/workflows/strategy-discovery-v4-2-funding-generalization.yml"

permissions:
  contents: read

concurrency:
  group: strategy-discovery-v4-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Build PnL-independent expansion panel and immutable history
        run: |
          mkdir -p artifacts/strategy_discovery_v4_2/data
          python scripts/prepare_strategy_discovery_v4_2_funding_generalization.py \
            --config config/strategy_discovery_v4_2_funding_generalization.json \
            --output-dir artifacts/strategy_discovery_v4_2/data \
            --max-workers 3
      - name: Run only the two frozen funding-spread cells
        run: |
          python scripts/run_strategy_discovery_v4_2_funding_generalization.py \
            --config config/strategy_discovery_v4_2_funding_generalization.json \
            --data-dir artifacts/strategy_discovery_v4_2/data \
            --output artifacts/strategy_discovery_v4_2/result.json
      - name: Guard evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/strategy_discovery_v4_2/result.json'))
          assert r['parent_holdout_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['live_enabled'] is False
          assert len(r['primary_results']) == 2
          assert sorted(x['nsett'] for x in r['primary_results']) == [3,5]
          PY
      - name: Deterministic multi-agent release-manager guard
        run: |
          orderflow-multi-agent --output artifacts/strategy_discovery_v4_2/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/strategy_discovery_v4_2/multi_agent_report.json'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit(r['release_manager']['next_actions'])
          PY
      - name: Preserve generalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v4-2-funding-generalization
          path: artifacts/strategy_discovery_v4_2/
          retention-days: 30
          if-no-files-found: warn
