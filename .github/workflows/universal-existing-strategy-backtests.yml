name: Universal Existing Strategy Backtests

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 2,5"

permissions:
  contents: read

jobs:
  universal-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Fetch frozen 8h research data
        run: |
          mkdir -p artifacts/data/8h
          orderflow-strategy-tournament-data \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT BNBUSDT ADAUSDT LINKUSDT SUIUSDT ENAUSDT \
            --interval 8h \
            --start 2024-01-01 \
            --end 2026-09-13 \
            --output-dir artifacts/data/8h
      - name: Universal DON8
        run: |
          orderflow-universal-backtest --data-dir artifacts/data/8h --family donchian_breakout \
            --grid-json '{"lookback":[55]}' --costs 12,16,20 --output artifacts/DON8_universal.json
      - name: Universal EMA8
        run: |
          orderflow-universal-backtest --data-dir artifacts/data/8h --family ema_tsmom \
            --grid-json '{"fast":[24],"slow":[96],"min_atr_spread":[0.25]}' --costs 12,16,20 --output artifacts/EMA8_universal.json
      - name: Universal VOL8
        run: |
          orderflow-universal-backtest --data-dir artifacts/data/8h --family vol_scaled_momentum \
            --grid-json '{"lookback":[24],"vol_window":[96],"threshold":[0.5]}' --costs 12,16,20 --output artifacts/VOL8_universal.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: universal-existing-strategy-backtests
          path: artifacts/*.json
          retention-days: 30
