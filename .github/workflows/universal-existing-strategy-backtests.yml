name: Universal Existing Strategy Backtests

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 2,5"

permissions:
  contents: read

jobs:
  universal-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Fetch frozen 8h research data
        run: |
          mkdir -p artifacts/data/8h
          orderflow-strategy-tournament-data \
            --config config/universal_existing_strategy_backtests_v1.json \
            --interval 8h \
            --output-dir artifacts/data/8h
      - name: Compatibility and diagnostic validation
        run: |
          orderflow-universal-existing-validation \
            --config config/universal_existing_strategy_backtests_v1.json \
            --data-dir artifacts/data/8h \
            --output artifacts/universal_existing_validation.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: universal-existing-strategy-backtests
          path: artifacts/
          retention-days: 30
