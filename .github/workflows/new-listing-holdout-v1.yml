name: New Listing Holdout v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/new_listing_holdout.py"
      - "config/new_listing_holdout_v1.json"
      - ".github/workflows/new-listing-holdout-v1.yml"

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_new_listing_holdout -v
      - name: Evaluate due batches
        run: python -m orderflow_edge_lab.new_listing_holdout --output-dir artifacts/new_listing_holdout
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: new-listing-holdout-v1
          path: artifacts/new_listing_holdout/
          if-no-files-found: error
