name: Discovery v2 Sprint 13 Payoff Meta

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint13-payoff-meta]
    paths:
      - 'config/discovery_v2_sprint13_payoff_meta_v1.json'
      - 'src/orderflow_edge_lab/discovery_v2_sprint13.py'
      - 'scripts/discovery_v2_sprint13.py'
      - 'tests/test_discovery_v2_sprint13.py'
      - 'pyproject.toml'
      - '.github/workflows/discovery-v2-sprint13.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run Sprint 13 guardrails before market data
        run: python -m pytest -q tests/test_discovery_v2_sprint13.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen Sprint 13 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_sprint13_payoff_meta_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_MARKET_RESULTS'
          assert p['execution']['leverage']==1.0
          assert p['walk_forward_model']['ridge_alpha']==10.0
          assert p['walk_forward_model']['training_window_prior_primary_setups']==80
          assert p['walk_forward_model']['minimum_prior_primary_setups']==60
          assert p['walk_forward_model']['trade_if_predicted_standalone_net_bps_greater_than']==0.0
          assert p['trial_accounting']['directional_candidate_rules_added_this_sprint']==1
          assert p['trial_accounting']['Sprint12_remains_closed'] is True
          assert p['data']['no_2025_data_for_discovery'] is True
          print('Frozen Sprint 13 contract verified.')
          PY
      - name: Run frozen D0 payoff meta sprint
        run: python scripts/discovery_v2_sprint13.py --protocol config/discovery_v2_sprint13_payoff_meta_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint13/results
      - name: Enforce result-state boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint13/results/sprint13_report.json').read_text())
          assert r['protocol_freeze_commit']=='815df9b5c3acec3b66d7b145ac7a9fabdd0524a3'
          assert r['independence_level']=='D0_PAYOFF_META_DISCOVERY'
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_execution_supported'] is False
          assert r['claims']['leverage_supported'] is False
          assert r['result']['state'] in {'FALSIFIED','RESEARCH_CANDIDATE_FREEZE_PENDING'}
          print(r['result']['state'])
          PY
      - name: Upload immutable Sprint 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint13-payoff-meta-v1
          path: |
            config/discovery_v2_sprint13_payoff_meta_v1.json
            research/discovery_v2/sprint13/results/
          retention-days: 30
          if-no-files-found: warn
