name: Trend Portfolio Forward v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/canonical_v3.py"
      - "src/orderflow_edge_lab/trend_portfolio_forward.py"
      - "config/universal_trend_portfolio_forward_v1.json"
      - "tests/test_trend_portfolio_forward.py"
      - ".github/workflows/trend-portfolio-forward-v1.yml"

permissions:
  contents: read

concurrency:
  group: trend-portfolio-forward-v1
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Run tests
        run: python -m unittest tests.test_canonical_v3 tests.test_trend_portfolio_forward -v
      - name: Run forward companion
        run: python -m orderflow_edge_lab.trend_portfolio_forward --output artifacts/trend_portfolio_forward/report.json
      - name: Enforce frozen boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/trend_portfolio_forward/report.json",encoding="utf-8"))
          if r["prospective_start_utc"] != "2026-09-28T00:00:00+00:00":
              raise SystemExit("prospective start changed")
          for key, flag in r["claims"].items():
              if key.endswith("_authorized") and flag:
                  raise SystemExit(f"companion exceeded authority: {key}")
          for series in r["daily_returns"].values():
              for stamp in series:
                  if stamp <= r["prospective_start_utc"]:
                      raise SystemExit("pre-start day scored")
          print(json.dumps({"status":r["status"],"days":r["forward"]["plain"]["days"],"latest_beta":r["latest_beta"]}))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trend-portfolio-forward-v1
          path: artifacts/trend_portfolio_forward/report.json
          if-no-files-found: error
