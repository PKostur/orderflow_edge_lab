name: Last Chance Structural Edge v1.2

on:
  workflow_dispatch:
  push:
    branches: [research/last-chance-structural-edge-v1]
    paths-ignore:
      - 'research/last_chance/results/**'

permissions:
  contents: write

concurrency:
  group: last-chance-structural-edge-v1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mexc-bitget-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime and tests
        run: python -m pip install -e '.[research]' pytest
      - name: Run funding-engine guardrails
        run: python -m pytest -q tests/test_cross_exchange_funding.py
      - name: Run frozen MEXC-Bitget funding study
        id: study
        shell: bash
        run: |
          mkdir -p research/last_chance/results
          set +e
          python -m orderflow_edge_lab.cli.cross_exchange_funding_bitget \
            --config config/last_chance_structural_edge_v1_2.json \
            --output research/last_chance/results/cross_exchange_funding_v1_2.json \
            --max-workers 5
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/last_chance/results/cross_exchange_funding_v1_2.json')
          if not p.exists():
              print('No result file created')
              raise SystemExit(0)
          r=json.load(open(p, encoding='utf-8'))
          if r.get('status') == 'data_source_failure':
              print(json.dumps({'status':r.get('status'),'loaded_symbols':r.get('loaded_symbols'),'load_failures':r.get('load_failures')},indent=2))
          else:
              primary=next(x for x in r['cost_cases'] if x['round_trip_pair_cost_bps']==r['primary_cost_bps'])
              print(json.dumps({
                  'status':r['status'],
                  'development':primary['development']['portfolio'],
                  'validation':primary['validation']['portfolio'],
                  'validation_positive_symbol_fraction':primary['validation']['positive_symbol_fraction'],
                  'reverse_validation':r['reverse_control']['validation']['portfolio'],
                  'gate':r['screening_gate'],
              },indent=2))
          PY
      - name: Commit immutable v1.2 result
        if: always()
        shell: bash
        run: |
          p='research/last_chance/results/cross_exchange_funding_v1_2.json'
          if [ ! -f "$p" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: preserve MEXC-Bitget funding result'
          for attempt in 1 2 3; do
            git pull --rebase origin research/last-chance-structural-edge-v1 && git push origin HEAD:research/last-chance-structural-edge-v1 && exit 0
            sleep 3
          done
          exit 1
      - name: Fail if study itself failed
        if: always()
        shell: bash
        run: |
          rc='${{ steps.study.outputs.exit_code }}'
          if [ -n "$rc" ] && [ "$rc" != '0' ]; then exit "$rc"; fi
