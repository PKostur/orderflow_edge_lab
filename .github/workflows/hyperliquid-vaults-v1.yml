name: Hyperliquid Vaults v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hyperliquid-vaults-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_hyperliquid_vaults -v
      - name: Recover the prior panel (latest non-expired artifact)
        run: |
          mkdir -p artifacts/hyperliquid_vaults/prior
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=hyperliquid-vaults-panel-v1&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/prior.zip
            unzip -o -q /tmp/prior.zip -d artifacts/hyperliquid_vaults/prior
            echo "recovered artifact ${id}"
          else
            echo "no prior panel: first collection run"
          fi
      - name: Collect
        run: |
          PRIOR=""
          if [ -f artifacts/hyperliquid_vaults/prior/index.json ]; then PRIOR="--prior-dir artifacts/hyperliquid_vaults/prior"; fi
          python -m orderflow_edge_lab.hyperliquid_vaults $PRIOR --output-dir artifacts/hyperliquid_vaults/current
      - name: Upload panel
        uses: actions/upload-artifact@v6
        with:
          name: hyperliquid-vaults-panel-v1
          path: artifacts/hyperliquid_vaults/current/
          retention-days: 90
          if-no-files-found: error
