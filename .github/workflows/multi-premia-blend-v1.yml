name: Multi Premia Blend v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/multi_premia_forward.py"
      - "src/orderflow_edge_lab/xs_premia.py"
      - "config/multi_premia_blend_v1.json"
      - "src/orderflow_edge_lab/multi_premia_human_forward.py"
      - "src/orderflow_edge_lab/zoo_mirror_forward.py"
      - "config/zoo_mirror_forward_v1.json"
      - ".github/workflows/multi-premia-blend-v1.yml"

permissions:
  contents: read

concurrency:
  group: multi-premia-blend-v1
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_xs_premia tests.test_multi_premia_forward tests.test_multi_premia_human_forward tests.test_zoo_mirror_forward -v
      - name: Run forward watch
        run: python -m orderflow_edge_lab.multi_premia_forward --output artifacts/multi_premia_blend/report.json
      - name: Run human-constrained forward watch (multi-premia-human-v1)
        run: python -m orderflow_edge_lab.multi_premia_human_forward --output artifacts/multi_premia_blend/human_report.json
      - name: Run zoo mirror forward watch (zoo-mirror-forward-v1)
        run: python -m orderflow_edge_lab.zoo_mirror_forward --output artifacts/multi_premia_blend/zoo_mirror_report.json
      - name: Enforce frozen boundary
        run: |
          python - <<'PY'
          import json
          starts={"report.json":"2026-09-29T00:00:00+00:00","human_report.json":"2026-09-29T00:00:00+00:00","zoo_mirror_report.json":"2026-10-03T00:00:00+00:00"}
          for name, start in starts.items():
            r=json.load(open("artifacts/multi_premia_blend/"+name,encoding="utf-8"))
            if r["prospective_start_utc"] != start:
                raise SystemExit("prospective start changed")
            for key, flag in r["claims"].items():
                if key.endswith("_authorized") and flag:
                    raise SystemExit(f"watch exceeded authority: {key}")
            for series in r["daily_returns"].values():
                for stamp in series:
                    if stamp <= r["prospective_start_utc"]:
                        raise SystemExit("pre-start day scored")
            print(json.dumps({"status":r["status"],"coins":r["coins_with_data"],"missing":r["missing_symbols"]}))
          PY
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: multi-premia-blend-v1
          path: |
            artifacts/multi_premia_blend/report.json
            artifacts/multi_premia_blend/human_report.json
            artifacts/multi_premia_blend/zoo_mirror_report.json
          if-no-files-found: error
