name: Multi Premia Blend v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/multi_premia_forward.py"
      - "src/orderflow_edge_lab/xs_premia.py"
      - "config/multi_premia_blend_v1.json"
      - ".github/workflows/multi-premia-blend-v1.yml"

permissions:
  contents: read

concurrency:
  group: multi-premia-blend-v1
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_xs_premia tests.test_multi_premia_forward -v
      - name: Run forward watch
        run: python -m orderflow_edge_lab.multi_premia_forward --output artifacts/multi_premia_blend/report.json
      - name: Enforce frozen boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/multi_premia_blend/report.json",encoding="utf-8"))
          if r["prospective_start_utc"] != "2026-09-29T00:00:00+00:00":
              raise SystemExit("prospective start changed")
          for key, flag in r["claims"].items():
              if key.endswith("_authorized") and flag:
                  raise SystemExit(f"watch exceeded authority: {key}")
          for series in r["daily_returns"].values():
              for stamp in series:
                  if stamp <= r["prospective_start_utc"]:
                      raise SystemExit("pre-start day scored")
          print(json.dumps({"status":r["status"],"coins":r["coins_with_data"],"missing":r["missing_symbols"]}))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: multi-premia-blend-v1
          path: artifacts/multi_premia_blend/report.json
          if-no-files-found: error
