name: VOL8 Payoff Amplitude Forward v1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "config/vol8_payoff_amplitude_forward_v1.json"
      - "src/orderflow_edge_lab/vol8_payoff_amplitude_forward.py"
      - "src/orderflow_edge_lab/cli/vol8_payoff_amplitude_forward.py"
      - "tests/test_vol8_payoff_amplitude_forward.py"
      - "docs/VOL8_PAYOFF_AMPLITUDE_FORWARD_V1.md"
      - ".github/workflows/vol8-payoff-amplitude-forward-v1.yml"
      - "pyproject.toml"
  schedule:
    - cron: "25 0,8,16 * * *"

permissions:
  contents: read

concurrency:
  group: vol8-payoff-amplitude-forward-v1
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run frozen watch tests
        run: python -m unittest tests.test_vol8_payoff_amplitude_forward -v
      - name: Build fresh prospective snapshot
        run: |
          mkdir -p artifacts/vol8_payoff_amplitude/source
          orderflow-vol8-payoff-amplitude-forward \
            --config config/vol8_payoff_amplitude_forward_v1.json \
            --output artifacts/vol8_payoff_amplitude/report.json \
            --source-dir artifacts/vol8_payoff_amplitude/source \
            --max-workers 5
      - name: Enforce observational evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/vol8_payoff_amplitude/report.json",encoding="utf-8"))
          if r["analysis"] != "vol8_payoff_amplitude_forward_v1":
              raise SystemExit("wrong VOL8 payoff-amplitude analysis")
          c=r["claims"]
          for key in ("strategy_filter_authorized","strategy_promotion_authorized","profitable_edge_established","live_trading_authorized","leverage_authorized"):
              if bool(c.get(key)):
                  raise SystemExit(f"VOL8 payoff-amplitude watch exceeded authority: {key}")
          if not bool(c.get("pre_start_entries_excluded")):
              raise SystemExit("pre-start entry boundary lost")
          if not bool(c.get("terminal_liquidations_excluded_from_completed_scoring")):
              raise SystemExit("terminal liquidation boundary lost")
          if not bool(c.get("volatility_state_does_not_gate_trade_generation")):
              raise SystemExit("volatility unexpectedly gates trade generation")
          if r["review_progress"]["formal_output"] not in ("WITHHELD","READY_FOR_REVIEW"):
              raise SystemExit("unexpected review output")
          print(json.dumps({
              "watch_id":r["watch_id"],
              "status":r["status"],
              "as_of_utc":r["as_of_utc"],
              "completed_trade_count":r["completed_trade_count"],
              "open_post_start_snapshot_count":r["open_post_start_snapshot_count"],
              "observed_symbol_count":r["observed_symbol_count"],
              "distinct_7d_entry_block_count":r["distinct_7d_entry_block_count"],
              "correlations":r["correlations"],
              "formal_output":r["review_progress"]["formal_output"],
          },indent=2))
          PY
      - name: Preserve prospective artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol8-payoff-amplitude-forward-v1
          path: artifacts/vol8_payoff_amplitude/
          retention-days: 90
          if-no-files-found: error
