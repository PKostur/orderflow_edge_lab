name: Residual Right-Tail Historical Replication Data v1

on:
  workflow_dispatch:
  push:
    branches: [research/residual-right-tail-historical-replication-v1]
    paths:
      - "config/residual_right_tail_historical_replication_v1.json"
      - ".github/workflows/residual-right-tail-historical-data-v1.yml"

permissions:
  contents: read

jobs:
  frozen-history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Fetch frozen public MEXC 1h history
        run: |
          orderflow-strategy-tournament-data \
            --config config/residual_right_tail_historical_replication_v1.json \
            --interval 1h \
            --output-dir artifacts/residual_right_tail_historical_replication_v1/data \
            --max-workers 8
      - name: Preserve immutable replication history
        uses: actions/upload-artifact@v4
        with:
          name: residual-right-tail-historical-replication-v1-data
          path: artifacts/residual_right_tail_historical_replication_v1/data/
          retention-days: 30
          if-no-files-found: error
