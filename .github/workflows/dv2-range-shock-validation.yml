name: DV2 Range Shock Momentum Validation

on:
  workflow_dispatch:
  push:
    branches: [research/dv2-range-shock-momentum-30d-v1]
    paths:
      - 'config/dv2_liquidity_range_shock_momentum_30d_v1.json'
      - 'config/dv2_liquidity_range_shock_momentum_30d_d2_binance_v1.json'
      - 'config/dv2_liquidity_range_shock_momentum_30d_d3_binance_2025_v1.json'
      - 'research/discovery_v2/range_shock_momentum_30d/**'
      - 'src/orderflow_edge_lab/range_shock_momentum_candidate.py'
      - 'src/orderflow_edge_lab/binance_vision.py'
      - 'scripts/dv2_range_shock_independent_reproduction.py'
      - 'scripts/dv2_range_shock_binance_validation.py'
      - 'tests/test_range_shock_momentum_candidate.py'
      - '.github/workflows/dv2-range-shock-validation.yml'

permissions:
  contents: read

concurrency:
  group: dv2-range-shock-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ORDERFLOW_BINANCE_FUNDING_SNAPSHOT: research/discovery_v2/range_shock_momentum_30d/binance_funding_tail_2026-09-01_2026-09-12.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run candidate guardrails
        run: python -m pytest -q tests/test_range_shock_momentum_candidate.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen candidate and validation contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('config/dv2_liquidity_range_shock_momentum_30d_v1.json').read_text())
          d2 = json.loads(Path('config/dv2_liquidity_range_shock_momentum_30d_d2_binance_v1.json').read_text())
          d3 = json.loads(Path('config/dv2_liquidity_range_shock_momentum_30d_d3_binance_2025_v1.json').read_text())
          assert c['status'] == 'FROZEN_CANDIDATE'
          assert c['rule']['range_baseline_days'] == 30
          assert c['rule']['leverage'] == 1.0
          assert c['rule']['transaction_cost_bps_per_side_on_actual_turnover'] == 10.0
          for d in (d2, d3):
              assert d['candidate_id'] == c['candidate_id']
              assert d['rule']['range_baseline_days'] == 30
              assert d['rule']['fixed_evaluation_warmup_days'] == 45
              assert d['rule']['leverage'] == 1.0
              assert d['claims']['live_execution_supported'] is False
              assert d['claims']['retuning_allowed'] is False
          assert d2['status'] == 'FROZEN_BEFORE_D2_RESULT'
          assert d3['status'] == 'FROZEN_BEFORE_D3_RESULT'
          print('Frozen candidate, D2 and D3 contracts verified.')
          PY
      - name: Verify preserved Binance funding snapshot
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('research/discovery_v2/range_shock_momentum_30d/binance_funding_tail_2026-09-01_2026-09-12.json')
          assert p.exists()
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == 'ba7f10432475e5dc885d309a67ae3f989c028d622e7371c07009e4fa45cdeea8', digest
          print({'funding_snapshot_sha256': digest})
          PY
      - name: Independent MEXC engine reproduction
        run: python scripts/dv2_range_shock_independent_reproduction.py --output-dir research/discovery_v2/range_shock_momentum_30d/reproduction/results
      - name: Enforce zero-disagreement reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research/discovery_v2/range_shock_momentum_30d/reproduction/results/REPRODUCTION_REPORT.json').read_text())
          assert r['zero_disagreement_pass'] is True
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_eligible'] is False
          print(r)
          PY
      - name: Run locked Binance D2 replication
        run: |
          python scripts/dv2_range_shock_binance_validation.py \
            --contract config/dv2_liquidity_range_shock_momentum_30d_d2_binance_v1.json \
            --output-dir research/discovery_v2/range_shock_momentum_30d/d2_binance/results
      - name: Enforce D2 claims boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research/discovery_v2/range_shock_momentum_30d/d2_binance/results/VALIDATION_REPORT.json').read_text())
          assert r['state'] in {'D2_SOURCE_REPLICATED','D2_SOURCE_FAILED'}
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_eligible'] is False
          print({'state':r['state'],'hard_gates':r['hard_gates'],'diagnostics':r['diagnostics']})
          PY
      - name: Run locked Binance 2025 D3 temporal holdout
        run: |
          python scripts/dv2_range_shock_binance_validation.py \
            --contract config/dv2_liquidity_range_shock_momentum_30d_d3_binance_2025_v1.json \
            --output-dir research/discovery_v2/range_shock_momentum_30d/d3_binance_2025/results
      - name: Enforce D3 claims boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research/discovery_v2/range_shock_momentum_30d/d3_binance_2025/results/VALIDATION_REPORT.json').read_text())
          assert r['state'] in {'D3_TEMPORAL_REPLICATED','D3_TEMPORAL_FAILED'}
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_eligible'] is False
          print({'state':r['state'],'hard_gates':r['hard_gates'],'diagnostics':r['diagnostics']})
          PY
      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dv2-range-shock-momentum-validation-v1
          path: |
            config/dv2_liquidity_range_shock_momentum_30d_v1.json
            config/dv2_liquidity_range_shock_momentum_30d_d2_binance_v1.json
            config/dv2_liquidity_range_shock_momentum_30d_d3_binance_2025_v1.json
            research/discovery_v2/range_shock_momentum_30d/FREEZE_CLARIFICATION.md
            research/discovery_v2/range_shock_momentum_30d/reproduction/results/
            research/discovery_v2/range_shock_momentum_30d/d2_binance/results/
            research/discovery_v2/range_shock_momentum_30d/d3_binance_2025/results/
          retention-days: 30
          if-no-files-found: warn
