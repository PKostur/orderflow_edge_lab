name: Deadline Release Candidate

on:
  push:
    branches: [release/deadline-2026-09-16]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full research stack
        run: python -m pip install -e ".[research]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Run deployment diagnostics
        run: python scripts/deployment_check.py
      - name: Run deterministic release-manager gate
        run: |
          mkdir -p artifacts/release_candidate
          orderflow-multi-agent --output artifacts/release_candidate/multi_agent_report.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/release_candidate/multi_agent_report.json', encoding='utf-8'))
          status=report['release_manager']['status']
          if status != 'reviewable':
              raise SystemExit(f'release manager blocked release candidate: {status}')
          PY
      - name: Build wheel and self-contained operator bundle
        run: |
          python -m pip wheel --no-deps . --wheel-dir artifacts/release_candidate
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          root=Path('.')
          stage=Path('artifacts/release_candidate/orderflow_edge_lab_deadline_bundle')
          stage.mkdir(parents=True, exist_ok=True)
          for name in ['README.md','AGENTS.md','pyproject.toml']:
              shutil.copy2(root/name, stage/name)
          for dirname in ['config','docs']:
              shutil.copytree(root/dirname, stage/dirname, dirs_exist_ok=True)
          wheels=list(Path('artifacts/release_candidate').glob('orderflow_edge_lab-*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one wheel, found {len(wheels)}')
          shutil.copy2(wheels[0], stage/wheels[0].name)
          install=(
              'Orderflow Edge Lab deadline bundle\n\n'
              'Python: 3.10-3.12\n'
              f'Install full research stack:\n  python -m pip install "./{wheels[0].name}[research]"\n\n'
              'Paper init:\n  orderflow-paper init --equity 10000\n'
              'Paper status:\n  orderflow-paper status\n'
              'Public MEXC capture:\n  orderflow-mexc-record --symbol ENA_USDT --symbol BTC_USDT\n'
              'Release-manager check:\n  orderflow-multi-agent --output multi_agent_report.json\n\n'
              'Automatic live exchange/broker transmission is intentionally absent.\n'
          )
          (stage/'INSTALL_AND_RUN.txt').write_text(install, encoding='utf-8')
          manifest={}
          for path in sorted(stage.rglob('*')):
              if path.is_file():
                  manifest[str(path.relative_to(stage))]=hashlib.sha256(path.read_bytes()).hexdigest()
          (stage/'SHA256_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          shutil.make_archive('artifacts/release_candidate/orderflow_edge_lab_deadline_bundle','zip',stage)
          PY
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-edge-lab-deadline-release-candidate
          path: |
            artifacts/release_candidate/orderflow_edge_lab-*.whl
            artifacts/release_candidate/orderflow_edge_lab_deadline_bundle.zip
            artifacts/release_candidate/multi_agent_report.json
          if-no-files-found: error
          retention-days: 30
