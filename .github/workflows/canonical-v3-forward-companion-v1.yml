name: Canonical v3 Forward Companion v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/canonical_v3.py"
      - "src/orderflow_edge_lab/canonical_v3_forward_companion.py"
      - "config/universal_canonical_v3_forward_companion_v1.json"
      - "tests/test_canonical_v3_forward_companion.py"
      - ".github/workflows/canonical-v3-forward-companion-v1.yml"

permissions:
  contents: read

concurrency:
  group: canonical-v3-forward-companion-v1
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Run tests
        run: python -m unittest tests.test_canonical_v3 tests.test_canonical_v3_forward_companion -v
      - name: Run forward companion
        run: python -m orderflow_edge_lab.canonical_v3_forward_companion --output artifacts/canonical_v3_forward_companion/report.json
      - name: Enforce frozen boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/canonical_v3_forward_companion/report.json",encoding="utf-8"))
          if r["prospective_start_utc"] != "2026-09-27T00:00:00+00:00":
              raise SystemExit("prospective start changed")
          for key, flag in r["claims"].items():
              if key.endswith("_authorized") and flag:
                  raise SystemExit(f"companion exceeded authority: {key}")
          for s in r["strategies"]:
              for t in s["completed_trades"]:
                  if t["entry"] < r["prospective_start_utc"]:
                      raise SystemExit("pre-start entry scored")
          print(json.dumps({"status":r["status"],"trades":{s["audit_id"]:s["completed_trade_count"] for s in r["strategies"]}}))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v3-forward-companion-v1
          path: artifacts/canonical_v3_forward_companion/report.json
          if-no-files-found: error
