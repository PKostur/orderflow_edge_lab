name: News Sentiment v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/payoff-geometry-v1-1
    paths:
      - "src/orderflow_edge_lab/news_sentiment.py"
      - "src/orderflow_edge_lab/news_sentiment_forward.py"
      - "config/news_sentiment_v1.json"
      - ".github/workflows/news-sentiment-v1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: news-sentiment-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_news_sentiment tests.test_news_sentiment_forward -v
      - name: Recover the prior ledger (latest successful run of this workflow)
        run: |
          mkdir -p artifacts/news_sentiment/prior
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=news-sentiment-ledger-v1&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/prior.zip
            unzip -o -q /tmp/prior.zip -d artifacts/news_sentiment/prior
            echo "recovered artifact ${id}"
          else
            echo "no prior ledger: first collection run"
          fi
      - name: Collect and score
        run: |
          PRIOR=""
          if [ -f artifacts/news_sentiment/prior/ledger.jsonl ]; then PRIOR="--prior-ledger artifacts/news_sentiment/prior/ledger.jsonl"; fi
          python -m orderflow_edge_lab.news_sentiment $PRIOR --output-dir artifacts/news_sentiment/current
      - name: Guard against ledger loss
        run: |
          python - <<'PY'
          import json, pathlib
          prior = pathlib.Path("artifacts/news_sentiment/prior/ledger.jsonl")
          cur = pathlib.Path("artifacts/news_sentiment/current/ledger.jsonl")
          n_prior = sum(1 for _ in prior.open(encoding="utf-8")) if prior.exists() else 0
          n_cur = sum(1 for _ in cur.open(encoding="utf-8"))
          if n_cur < n_prior:
              raise SystemExit(f"ledger shrank: {n_prior} -> {n_cur}")
          r = json.load(open("artifacts/news_sentiment/current/report.json", encoding="utf-8"))
          if any(v for k, v in r["claims"].items() if k.endswith("_authorized")):
              raise SystemExit("claims exceeded authority")
          print(json.dumps({"prior": n_prior, "current": n_cur}))
          PY
      - name: Score strategies on forward days
        run: python -m orderflow_edge_lab.news_sentiment_forward --daily artifacts/news_sentiment/current/daily.json --output artifacts/news_sentiment/current/forward_report.json
      - name: Upload ledger
        uses: actions/upload-artifact@v7
        with:
          name: news-sentiment-ledger-v1
          path: artifacts/news_sentiment/current/
          retention-days: 90
          if-no-files-found: error
