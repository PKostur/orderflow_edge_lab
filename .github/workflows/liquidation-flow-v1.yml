name: Liquidation Flow v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: liquidation-flow-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[research]"
      - name: Tests
        run: python -m unittest tests.test_liquidation_flow -v
      - name: Recover the prior ledger (latest non-expired artifact)
        run: |
          mkdir -p artifacts/liquidation_flow/prior
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=liquidation-flow-ledger-v1&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/prior.zip
            unzip -o -q /tmp/prior.zip -d artifacts/liquidation_flow/prior
            echo "recovered artifact ${id}"
          else
            echo "no prior ledger: first collection run"
          fi
      - name: Collect
        run: |
          PRIOR=""
          if [ -f artifacts/liquidation_flow/prior/meta.json ]; then PRIOR="--prior-dir artifacts/liquidation_flow/prior"; fi
          python -m orderflow_edge_lab.liquidation_flow $PRIOR --output-dir artifacts/liquidation_flow/current
      - name: Guard against ledger loss
        run: |
          python - <<'PY'
          import json, pathlib
          prior = pathlib.Path("artifacts/liquidation_flow/prior/ledger.jsonl")
          cur = pathlib.Path("artifacts/liquidation_flow/current/ledger.jsonl")
          n_prior = sum(1 for _ in prior.open(encoding="utf-8")) if prior.exists() else 0
          n_cur = sum(1 for _ in cur.open(encoding="utf-8"))
          if n_cur < n_prior:
              raise SystemExit(f"ledger shrank: {n_prior} -> {n_cur}")
          r = json.load(open("artifacts/liquidation_flow/current/report.json", encoding="utf-8"))
          if any(v for k, v in r["claims"].items() if k.endswith("_authorized")):
              raise SystemExit("claims exceeded authority")
          print(json.dumps({"prior": n_prior, "current": n_cur}))
          PY
      - name: Upload ledger
        uses: actions/upload-artifact@v6
        with:
          name: liquidation-flow-ledger-v1
          path: artifacts/liquidation_flow/current/
          retention-days: 90
          if-no-files-found: error
