name: Independent Calibration v2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-offline-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      ORDERFLOW_REQUIRE_INDEPENDENT_ENGINE: "1"
      ORDERFLOW_NAUTILUS_WHEEL: ${{ github.workspace }}/artifacts/native-wheels/nautilus_trader-2.0.0rc5-cp312-cp312-manylinux_2_34_x86_64.whl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install reviewed build and research dependency closure
        run: >-
          python -m pip install --require-hashes
          -r requirements/locks/build-ci.txt -r requirements/locks/research-ci.txt
      - name: Fetch and install the exact independent engine wheel
        run: |
          mkdir -p artifacts/native-wheels
          python -m pip download --no-deps --only-binary=:all: --require-hashes \
            -r requirements/locks/independent-calibration-py312-linux.txt \
            --dest artifacts/native-wheels
          python -m pip install --no-deps --no-index --require-hashes \
            --find-links artifacts/native-wheels \
            -r requirements/locks/independent-calibration-py312-linux.txt
      - name: Run required native fixtures and economic perturbation regressions
        run: |
          set -o pipefail
          python -m unittest -v \
            tests/test_v2_13_independent_calibration.py \
            tests/test_v2_05_backtesting.py \
            2>&1 | tee artifacts/independent-engine-tests.log
      - name: Retain bounded synthetic calibration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-native-calibration-v2
          path: artifacts/independent-engine-tests.log
          if-no-files-found: error
          retention-days: 14
