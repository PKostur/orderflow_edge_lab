name: Gold Scheduled Macro Reaction v1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-scheduled-macro-reaction-v1]
    paths:
      - "config/gold_scheduled_macro_reaction_v1.json"
      - "research/gold_scheduled_macro_reaction_v1/EVENT_CALENDAR.csv"
      - "research/gold_scheduled_macro_reaction_v1/PROTOCOL.md"
      - "research/gold_scheduled_macro_reaction_v1/SOURCE_AMENDMENT_PRE_SCORE.md"
      - "scripts/run_gold_scheduled_macro_reaction_v1.py"
      - ".github/workflows/gold-scheduled-macro-reaction-v1.yml"

permissions:
  contents: read

concurrency:
  group: gold-scheduled-macro-reaction-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install state runtime
        run: python -m pip install pandas numpy

      - name: Fetch pinned Dukascopy XAUUSD M1 bid and ask months
        run: |
          set -euo pipefail
          root="artifacts/gold_scheduled_macro_reaction_v1/data"
          src="$root/source"
          mkdir -p "$src"
          base="https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/922f83a60cc574e7395fb27397077288055a1ef6"

          months=(2020_11 2020_12)
          for year in 2021 2022; do
            for month in {01..12}; do
              months+=("${year}_${month}")
            done
          done

          for ym in "${months[@]}"; do
            for side in bid ask; do
              file="xauusd_${side}_m1_${ym}.csv"
              curl --fail --location --retry 3 --retry-delay 2 \
                "$base/xauusd/$side/m1/$file" \
                -o "$src/$file"
            done
          done

          test "$(find "$src" -type f -name 'xauusd_*_m1_*.csv' | wc -l)" -eq 52
          sha256sum "$src"/*.csv | sort > "$root/SOURCE_SHA256.txt"
          head -n 3 "$src/xauusd_bid_m1_2021_01.csv"
          head -n 3 "$src/xauusd_ask_m1_2021_01.csv"

      - name: Materialize only warmup plus open development data
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('artifacts/gold_scheduled_macro_reaction_v1/data')
          src=root/'source'
          dst=root/'XAUUSD_M1_dev.csv'
          required={'timestamp','open','high','low','close'}
          frames=[]
          month_rows={}

          bid_files=sorted(src.glob('xauusd_bid_m1_*.csv'))
          if len(bid_files) != 26:
              raise SystemExit(f'expected 26 bid months, found {len(bid_files)}')

          for bp in bid_files:
              ym=bp.stem.replace('xauusd_bid_m1_','')
              ap=src/f'xauusd_ask_m1_{ym}.csv'
              if not ap.exists():
                  raise SystemExit(f'missing ask month for {ym}')
              bid=pd.read_csv(bp)
              ask=pd.read_csv(ap)
              bid.columns=[str(c).strip().lower() for c in bid.columns]
              ask.columns=[str(c).strip().lower() for c in ask.columns]
              if not required.issubset(bid.columns) or not required.issubset(ask.columns):
                  raise SystemExit(f'schema mismatch for {ym}: bid={list(bid.columns)}, ask={list(ask.columns)}')
              b=bid[['timestamp','open','high','low','close']].copy()
              a=ask[['timestamp','open','high','low','close']].copy()
              merged=b.merge(a,on='timestamp',how='inner',suffixes=('_bid','_ask'),validate='one_to_one')
              out=pd.DataFrame({'time':pd.to_datetime(merged['timestamp'],unit='ms',utc=True,errors='coerce')})
              for c in ('open','high','low','close'):
                  out[c]=(pd.to_numeric(merged[f'{c}_bid'],errors='coerce')+pd.to_numeric(merged[f'{c}_ask'],errors='coerce'))/2.0
              out=out.dropna().drop_duplicates('time',keep='last').sort_values('time')
              if out.empty:
                  raise SystemExit(f'no valid synchronized rows for {ym}')
              month_rows[ym]=int(len(out))
              frames.append(out)

          d=pd.concat(frames,ignore_index=True).drop_duplicates('time',keep='last').sort_values('time')
          warmup=pd.Timestamp('2020-11-01T00:00:00Z')
          locked=pd.Timestamp('2023-01-01T00:00:00Z')
          d=d[(d.time>=warmup)&(d.time<locked)].copy()
          if d.empty:
              raise SystemExit('no development rows')
          if d.time.min() > pd.Timestamp('2020-11-03T00:00:00Z'):
              raise SystemExit(f'warmup coverage starts too late: {d.time.min()}')
          if d.time.max() < pd.Timestamp('2022-12-29T00:00:00Z'):
              raise SystemExit(f'development coverage ends too early: {d.time.max()}')
          if d.time.max() >= locked:
              raise SystemExit('locked 2023 leaked into development materialization')
          if not (d[['open','high','low','close']] > 0).all().all():
              raise SystemExit('non-positive OHLC after midpoint construction')
          if not ((d['high'] >= d[['open','close']].max(axis=1)) & (d['low'] <= d[['open','close']].min(axis=1))).all():
              raise SystemExit('invalid midpoint OHLC ordering')

          d.to_csv(dst,index=False)
          manifest={
            'amendment_status':'pre_score_implementation_amendment',
            'prior_source_state_result_produced':False,
            'source_repository':'kevingtlin/Market-Data-Lab',
            'source_commit':'922f83a60cc574e7395fb27397077288055a1ef6',
            'dataset_id':'XAUUSD-DUKASCOPY-M1-BID-ASK',
            'provider':'Dukascopy',
            'instrument':'XAUUSD spot gold',
            'source_timestamp_unit':'milliseconds',
            'source_timestamp_timezone':'UTC',
            'state_price':'inner-joined bid/ask midpoint OHLC',
            'source_months':'2020-11 through 2022-12',
            'source_file_count':52,
            'month_rows':month_rows,
            'warmup_start_utc':str(d.time.min()),
            'development_end_exclusive_utc':'2023-01-01 00:00:00+00:00',
            'locked_2023_materialized':False,
            'rows':int(len(d)),
            'last_row_utc':str(d.time.max()),
            'development_sha256':hashlib.sha256(dst.read_bytes()).hexdigest(),
          }
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({k:v for k,v in manifest.items() if k!='month_rows'},indent=2,sort_keys=True))
          PY
          rm -rf artifacts/gold_scheduled_macro_reaction_v1/data/source

      - name: Guard frozen calendar and protocol before scoring
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          cfg=json.load(open('config/gold_scheduled_macro_reaction_v1.json',encoding='utf-8'))
          cal=pd.read_csv('research/gold_scheduled_macro_reaction_v1/EVENT_CALENDAR.csv')
          manifest=json.load(open('artifacts/gold_scheduled_macro_reaction_v1/data/MANIFEST.json',encoding='utf-8'))
          assert cfg['state_scoring_enabled'] is True
          assert cfg['economic_scoring_enabled'] is False
          assert cfg['evidence_boundary']['validation_opened'] is False
          assert cfg['source_amendment']['status']=='pre_score_implementation_amendment'
          assert cfg['source_amendment']['prior_source_state_result_produced'] is False
          assert cfg['source_amendment']['hypotheses_changed'] is False
          assert cfg['gold_source']['repository']=='kevingtlin/Market-Data-Lab'
          assert cfg['gold_source']['commit']=='922f83a60cc574e7395fb27397077288055a1ef6'
          assert cfg['gold_source']['timestamp_unit']=='milliseconds'
          assert cfg['gold_source']['timestamp_timezone']=='UTC'
          assert manifest['locked_2023_materialized'] is False
          assert manifest['source_file_count']==52
          assert len(cal)==64
          counts=cal['event_type'].value_counts().to_dict()
          assert counts=={'cpi':24,'employment':24,'fomc':16}, counts
          assert set(cal['date_local'].astype(str).str[:4])=={'2021','2022'}
          assert len(cfg['primary_hypotheses'])==6
          assert int(cfg['statistics']['permutation_epochs'])==20000
          assert float(cfg['statistics']['fdr_q_max'])==0.10
          PY

      - name: Run frozen development state study
        run: |
          python scripts/run_gold_scheduled_macro_reaction_v1.py \
            --config config/gold_scheduled_macro_reaction_v1.json \
            --calendar research/gold_scheduled_macro_reaction_v1/EVENT_CALENDAR.csv \
            --gold artifacts/gold_scheduled_macro_reaction_v1/data/XAUUSD_M1_dev.csv \
            --output artifacts/gold_scheduled_macro_reaction_v1/state_result.json

      - name: Guard evidence boundary and claims
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_scheduled_macro_reaction_v1/state_result.json',encoding='utf-8'))
          assert r['stage']=='development_state_only'
          assert r['calendar_events']==64
          assert r['primary_hypothesis_count']==6
          assert r['holdout_opened'] is False
          assert r['economic_scoring_run'] is False
          assert r['claims']['executable_edge_established'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-scheduled-macro-reaction-v1
          path: |
            artifacts/gold_scheduled_macro_reaction_v1/state_result.json
            artifacts/gold_scheduled_macro_reaction_v1/data/MANIFEST.json
            artifacts/gold_scheduled_macro_reaction_v1/data/SOURCE_SHA256.txt
          retention-days: 30
          if-no-files-found: warn
