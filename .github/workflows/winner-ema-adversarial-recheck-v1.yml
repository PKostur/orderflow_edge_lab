name: Winner EMA Adversarial Recheck v1

on:
  workflow_dispatch:
  push:
    branches: [research/winner-condition-replication-v1]
    paths:
      - scripts/winner_ema_adversarial_recheck.py
      - tests/test_winner_ema_adversarial_recheck.py
      - .github/workflows/winner-ema-adversarial-recheck-v1.yml

permissions:
  contents: read

concurrency:
  group: winner-ema-adversarial-recheck-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Compile and run focused regression tests
        run: |
          python -m compileall -q scripts/winner_ema_adversarial_recheck.py
          python -m unittest tests.test_winner_ema_adversarial_recheck -v
      - name: Fetch frozen 8h MEXC development history
        run: |
          mkdir -p artifacts/winner_ema_recheck/data
          orderflow-strategy-tournament-data \
            --config config/evidence_backed_strategies_v2.json \
            --interval 8h \
            --output-dir artifacts/winner_ema_recheck/data \
            --max-workers 8
      - name: Recheck shared-window dependence, neighborhood, cost and concentration
        run: |
          python scripts/winner_ema_adversarial_recheck.py \
            --data-dir artifacts/winner_ema_recheck/data \
            --output artifacts/winner_ema_recheck/report.json
      - name: Deterministic multi-agent release gate
        run: |
          orderflow-multi-agent --output artifacts/winner_ema_recheck/multi_agent_report.json
          python - <<'PY'
          import json
          report = json.load(open('artifacts/winner_ema_recheck/multi_agent_report.json', encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit('deterministic release manager blocked the research run')
          PY
      - name: Preserve corrected development robustness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-ema-adversarial-recheck-v1
          path: |
            artifacts/winner_ema_recheck/report.json
            artifacts/winner_ema_recheck/multi_agent_report.json
            artifacts/winner_ema_recheck/data/manifest.json
          retention-days: 30
          if-no-files-found: warn
