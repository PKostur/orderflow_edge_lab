name: Gold Macro Trend v2 Development

on:
  workflow_dispatch:
  push:
    branches: [research/gold-macro-trend-v2]
    paths:
      - "config/gold_macro_trend_v2.json"
      - "config/gold_macro_trend_v2_1_source_amendment.json"
      - "scripts/prepare_gold_macro_trend_v2.py"
      - "scripts/run_gold_macro_trend_v2.py"
      - ".github/workflows/gold-macro-trend-v2.yml"

permissions:
  contents: read

concurrency:
  group: gold-macro-trend-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install pandas numpy requests yfinance
      - name: Acquire amended gold silver proxy and macro histories
        run: |
          mkdir -p artifacts/gold_macro_trend_v2/data
          python scripts/prepare_gold_macro_trend_v2.py --output-dir artifacts/gold_macro_trend_v2/data
      - name: Run state-first 2010-2020 development tournament
        run: |
          python scripts/run_gold_macro_trend_v2.py \
            --data-dir artifacts/gold_macro_trend_v2/data \
            --output artifacts/gold_macro_trend_v2/development.json
      - name: Guard sealed validation and claims
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_macro_trend_v2/development.json'))
          assert r['stage']=='development_only'
          assert r['locked_internal_validation_opened'] is False
          assert len(r['candidate_freeze']) <= 4
          assert r['claims']['verified_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['live_enabled'] is False
          PY
      - name: Deterministic multi-agent release-manager guard
        run: |
          python -m pip install -e ".[research]"
          orderflow-multi-agent --output artifacts/gold_macro_trend_v2/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_macro_trend_v2/multi_agent_report.json'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit(r['release_manager']['next_actions'])
          PY
      - name: Preserve development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-macro-trend-v2-development
          path: artifacts/gold_macro_trend_v2/
          retention-days: 30
          if-no-files-found: warn
