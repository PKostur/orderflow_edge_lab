name: Gold Strategy Discovery v1.0.1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-strategy-discovery-v1-0-1]
    paths:
      - "config/gold_strategy_discovery_v1.json"
      - "scripts/run_gold_strategy_discovery_v1.py"
      - "scripts/run_gold_strategy_discovery_v1_fixed.py"
      - ".github/workflows/gold-strategy-discovery-v1-0-1.yml"

permissions:
  contents: read

concurrency:
  group: gold-strategy-discovery-v1-0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Fetch frozen public XAUUSD histories
        run: |
          mkdir -p artifacts/gold_strategy_discovery_v1_0_1/data
          base="https://raw.githubusercontent.com/simom1/XAUUSD-history/main/Gold-Cash/XAUUSD"
          for f in XAUUSD_M15_2010_2026.csv XAUUSD_H1_2010_2026.csv XAUUSD_H4_2010_2026.csv XAUUSD_D1_2010_2026.csv; do
            curl -fL --retry 3 "$base/$f" -o "artifacts/gold_strategy_discovery_v1_0_1/data/$f"
          done
          sha256sum artifacts/gold_strategy_discovery_v1_0_1/data/*.csv > artifacts/gold_strategy_discovery_v1_0_1/data/SHA256SUMS.txt
      - name: Run development tournament
        run: |
          python scripts/run_gold_strategy_discovery_v1_fixed.py \
            --data-dir artifacts/gold_strategy_discovery_v1_0_1/data \
            --output artifacts/gold_strategy_discovery_v1_0_1/development_results.json
      - name: Enforce complete valid development evidence
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_strategy_discovery_v1_0_1/development_results.json'))
          if r['error_count'] != 0:
              raise SystemExit(f"strategy trial errors: {r['error_count']}")
          floors={'M15':40,'H1':8,'H4':2,'D1':0.8}
          bad={tf:v for tf,v in r['integrity'].items() if v['median_bars_per_day'] < floors[tf]}
          if bad:
              raise SystemExit(f'data integrity floor failed: {bad}')
          if r['holdout_opened']:
              raise SystemExit('holdout must remain sealed')
          PY
      - name: Preserve development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-strategy-discovery-v1-0-1-development
          path: artifacts/gold_strategy_discovery_v1_0_1/
          retention-days: 30
          if-no-files-found: error
