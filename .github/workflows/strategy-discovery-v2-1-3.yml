name: Strategy Discovery v2.1.3 Low-Turnover

on:
  workflow_dispatch:
  push:
    branches: [research/strategy-discovery-v2]
    paths:
      - "config/strategy_discovery_v2_1.json"
      - "config/strategy_discovery_v2_1_1_amendment.json"
      - "config/strategy_discovery_v2_1_2_amendment.json"
      - "config/strategy_discovery_v2_1_3_amendment.json"
      - "scripts/run_strategy_discovery_v2_1.py"
      - "scripts/run_strategy_discovery_v2_1_3.py"
      - "tests/test_strategy_discovery_v2_1_3.py"
      - ".github/workflows/strategy-discovery-v2-1-3.yml"

permissions:
  contents: read

concurrency:
  group: strategy-discovery-v2-1-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-guard:
    name: pre-outcome-v2-1-3-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime and test runner
        run: python -m pip install -e ".[research]" pytest
      - name: Verify exit alignment and frozen symbol-breadth gates
        run: python -m pytest -q tests/test_strategy_discovery_v2_1_3.py

  prepare-data:
    name: prepare-${{ matrix.interval }}
    needs: protocol-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        interval: [15m, 1h]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Fetch immutable public MEXC history from frozen base protocol
        run: |
          orderflow-strategy-tournament-data \
            --config config/strategy_discovery_v2_1.json \
            --interval "${{ matrix.interval }}" \
            --output-dir "artifacts/strategy_discovery_v2_1_3/data/${{ matrix.interval }}" \
            --max-workers 8
      - name: Preserve immutable history and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v2-1-3-data-${{ matrix.interval }}
          path: artifacts/strategy_discovery_v2_1_3/data/${{ matrix.interval }}/
          retention-days: 7
          if-no-files-found: warn

  evaluate:
    name: evaluate-${{ matrix.interval }}
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        interval: [15m, 1h]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Download matching immutable history
        uses: actions/download-artifact@v4
        with:
          name: strategy-discovery-v2-1-3-data-${{ matrix.interval }}
          path: artifacts/strategy_discovery_v2_1_3/data/${{ matrix.interval }}
      - name: Run v2.1.3 state-first causal tournament
        run: |
          python scripts/run_strategy_discovery_v2_1_3.py \
            --config config/strategy_discovery_v2_1.json \
            --data-dir "artifacts/strategy_discovery_v2_1_3/data/${{ matrix.interval }}" \
            --interval "${{ matrix.interval }}" \
            --output "artifacts/strategy_discovery_v2_1_3/results/${{ matrix.interval }}.json"
      - name: Preserve every state and economic trial
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v2-1-3-result-${{ matrix.interval }}
          path: artifacts/strategy_discovery_v2_1_3/results/${{ matrix.interval }}.json
          retention-days: 30
          if-no-files-found: error

  aggregate:
    name: aggregate-adversarial-release-gate
    needs: evaluate
    if: always() && needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Download only v2.1.3 interval reports
        uses: actions/download-artifact@v4
        with:
          pattern: strategy-discovery-v2-1-3-result-*
          path: artifacts/strategy_discovery_v2_1_3/all_results
          merge-multiple: false
      - name: Build immutable v2.1.3 summary
        run: |
          mkdir -p artifacts/strategy_discovery_v2_1_3/aggregate
          python - <<'PY'
          import json
          from pathlib import Path

          reports=[]
          for p in Path('artifacts/strategy_discovery_v2_1_3/all_results').rglob('*.json'):
              reports.append(json.load(open(p, encoding='utf-8')))
          if len(reports) != 2:
              raise SystemExit(f'expected 2 v2.1.3 reports, found {len(reports)}')
          if any(r.get('protocol_name') != 'strategy-discovery-v2.1.3-low-turnover' for r in reports):
              raise SystemExit('unexpected protocol identity')

          states=[]
          primary=[]
          for r in reports:
              states.extend(r.get('top_state', []))
              primary.extend(r.get('primary_cost_leaderboard', []))
          states.sort(key=lambda x:(x.get('state_pass',False),x.get('median_fold_spearman',-1e99)), reverse=True)
          primary.sort(key=lambda x:(x.get('economic_pass',False),x.get('median_fold_net_expectancy_bps',-1e99)), reverse=True)
          minimum_symbols=8
          for row in states:
              if row.get('state_pass') and int(row.get('state_symbol_breadth',0)) < minimum_symbols:
                  raise SystemExit('state pass violated frozen symbol breadth')
          for row in primary:
              if row.get('economic_pass') and int(row.get('symbol_breadth',0)) < minimum_symbols:
                  raise SystemExit('economic pass violated frozen symbol breadth')

          out={
              'schema_version':1,
              'protocol_name':'strategy-discovery-v2.1.3-low-turnover',
              'base_config':'config/strategy_discovery_v2_1.json',
              'amendment':'config/strategy_discovery_v2_1_3_amendment.json',
              'interval_reports':[{k:r[k] for k in ['interval','state_trial_count','state_pass_count','translation_count','economic_pass_count_primary']} for r in reports],
              'economic_pass_count_primary':sum(int(r.get('economic_pass_count_primary',0)) for r in reports),
              'top_state':states[:30],
              'primary_cost_leaderboard':primary[:60],
              'superseded_result_artifacts_used':False,
              'claims':{'development_screening_only':True,'profitable_edge_established':False,'verified_oos':False,'live_enabled':False},
          }
          Path('artifacts/strategy_discovery_v2_1_3/aggregate/summary.json').write_text(json.dumps(out,indent=2,allow_nan=False),encoding='utf-8')
          print(json.dumps({
              'interval_reports':out['interval_reports'],
              'economic_pass_count_primary':out['economic_pass_count_primary'],
              'top_state':out['top_state'][:8],
              'top_primary':out['primary_cost_leaderboard'][:8],
              'superseded_result_artifacts_used':False,
          },indent=2,allow_nan=False))
          PY
      - name: Deterministic multi-agent release manager gate
        run: |
          orderflow-multi-agent --output artifacts/strategy_discovery_v2_1_3/aggregate/multi_agent_report.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/strategy_discovery_v2_1_3/aggregate/multi_agent_report.json',encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit(f"release manager blocked: {report['release_manager']['next_actions']}")
          PY
      - name: Preserve v2.1.3 aggregate and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v2-1-3-aggregate
          path: artifacts/strategy_discovery_v2_1_3/aggregate/
          retention-days: 30
          if-no-files-found: error
