name: Cross-Asset Trend ETF D0

on:
  push:
    branches: [research/cross-asset-trend-etf-v1]
    paths:
      - "research/cross_asset_trend_etf_v1/FREEZE.json"
      - "scripts/cross_asset_trend_etf_v1.py"
      - ".github/workflows/cross_asset_trend_etf_d0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cross-asset-trend-etf-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen D0
        run: python scripts/cross_asset_trend_etf_v1.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cross_asset_trend_etf_v1/D0_RESULT.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record cross-asset trend ETF v1 D0 result"
            git push origin HEAD:research/cross-asset-trend-etf-v1
          fi
