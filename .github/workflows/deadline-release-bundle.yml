name: Deadline Standalone Release Bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/deadline-bundle-v1]

permissions:
  contents: read

concurrency:
  group: deadline-release-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[research]"
          python -m unittest discover -s tests -v
      - name: Deterministic release-manager gate
        run: |
          mkdir -p artifacts/release
          orderflow-multi-agent --output artifacts/release/multi_agent_report.json
          python - <<'PY'
          import json
          p='artifacts/release/multi_agent_report.json'
          r=json.load(open(p, encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit('deterministic release manager blocked standalone bundle')
          PY
      - name: Build installable wheel and standalone bundle
        run: |
          python -m build --wheel --outdir artifacts/release/wheels
          python -m pip freeze > artifacts/release/runtime_freeze.txt
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import shutil
          import zipfile

          root=Path('.')
          bundle=Path('artifacts/release/bundle')
          bundle.mkdir(parents=True, exist_ok=True)
          for name in ['config','docs','src','tests']:
              src=root/name
              if src.exists():
                  shutil.copytree(src, bundle/name, dirs_exist_ok=True)
          for name in ['pyproject.toml','README.md','AGENTS.md']:
              src=root/name
              if src.exists():
                  shutil.copy2(src, bundle/name)
          shutil.copytree('artifacts/release/wheels', bundle/'wheels', dirs_exist_ok=True)
          shutil.copy2('artifacts/release/runtime_freeze.txt', bundle/'runtime_freeze.txt')
          shutil.copy2('artifacts/release/multi_agent_report.json', bundle/'multi_agent_report.json')

          manifest={}
          for path in sorted(p for p in bundle.rglob('*') if p.is_file()):
              rel=path.relative_to(bundle).as_posix()
              manifest[rel]=sha256(path.read_bytes()).hexdigest()
          (bundle/'SHA256_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')

          archive=Path('artifacts/release/orderflow_edge_lab_deadline_bundle.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(p for p in bundle.rglob('*') if p.is_file()):
                  zf.write(path, path.relative_to(bundle))
          (Path('artifacts/release')/'BUNDLE_SHA256.txt').write_text(sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n', encoding='utf-8')
          print(f'bundle={archive} bytes={archive.stat().st_size}')
          PY
      - name: Smoke install wheel outside checkout
        run: |
          python -m venv /tmp/orderflow-release-smoke
          /tmp/orderflow-release-smoke/bin/python -m pip install artifacts/release/wheels/orderflow_edge_lab-*.whl
          /tmp/orderflow-release-smoke/bin/orderflow-readiness --help >/dev/null
      - name: Preserve standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-edge-lab-deadline-standalone
          path: |
            artifacts/release/orderflow_edge_lab_deadline_bundle.zip
            artifacts/release/BUNDLE_SHA256.txt
            artifacts/release/multi_agent_report.json
          retention-days: 30
          if-no-files-found: error
