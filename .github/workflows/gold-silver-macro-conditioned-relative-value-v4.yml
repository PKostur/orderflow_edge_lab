name: Gold Silver Macro-Conditioned Relative Value v4

on:
  workflow_dispatch:
  push:
    branches: [research/gold-silver-macro-conditioned-relative-value-v4]
    paths:
      - "config/gold_silver_macro_conditioned_relative_value_v4.json"
      - "research/gold_silver_macro_conditioned_relative_value_v4/IMPLEMENTATION_FREEZE.md"
      - "scripts/run_gold_silver_macro_conditioned_relative_value_v4.py"
      - ".github/workflows/gold-silver-macro-conditioned-relative-value-v4.yml"

permissions:
  contents: read

concurrency:
  group: gold-silver-macro-conditioned-relative-value-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy scikit-learn
      - name: Fetch pinned XAUUSD and XAGUSD cash data
        run: |
          set -euo pipefail
          mkdir -p artifacts/gold_silver_macro_conditioned_relative_value_v4/data
          base="https://raw.githubusercontent.com/simom1/XAUUSD-history/bda79c6c5ce09a5b488d4cd2c20fcd19bdd2ed3a"
          curl --fail --location --retry 4 --retry-delay 2 \
            "$base/Gold-Cash/XAUUSD/XAUUSD_D1_2010_2026.csv" \
            -o artifacts/gold_silver_macro_conditioned_relative_value_v4/data/XAUUSD_D1.csv
          curl --fail --location --retry 4 --retry-delay 2 \
            "$base/Silver-Cash/XAGUSD/XAGUSD_D1.csv" \
            -o artifacts/gold_silver_macro_conditioned_relative_value_v4/data/XAGUSD_D1.csv
      - name: Fetch official FRED macro series
        run: |
          set -euo pipefail
          out=artifacts/gold_silver_macro_conditioned_relative_value_v4/data
          for sid in VIXCLS DFII10 DTWEXBGS; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=${sid}" \
              -o "$out/${sid}.csv"
          done
          sha256sum "$out"/*.csv > "$out/SHA256SUMS.txt"
      - name: Run frozen development study
        run: |
          python scripts/run_gold_silver_macro_conditioned_relative_value_v4.py \
            --config config/gold_silver_macro_conditioned_relative_value_v4.json \
            --gold artifacts/gold_silver_macro_conditioned_relative_value_v4/data/XAUUSD_D1.csv \
            --silver artifacts/gold_silver_macro_conditioned_relative_value_v4/data/XAGUSD_D1.csv \
            --vix artifacts/gold_silver_macro_conditioned_relative_value_v4/data/VIXCLS.csv \
            --real-yield artifacts/gold_silver_macro_conditioned_relative_value_v4/data/DFII10.csv \
            --dollar artifacts/gold_silver_macro_conditioned_relative_value_v4/data/DTWEXBGS.csv \
            --output artifacts/gold_silver_macro_conditioned_relative_value_v4/result.json
      - name: Guard research boundary
        run: |
          python - <<'PY'
          import json
          p='artifacts/gold_silver_macro_conditioned_relative_value_v4/result.json'
          r=json.load(open(p))
          assert r['protocol'] == 'gold_silver_macro_conditioned_relative_value_v4'
          assert r['grid']['state_hypotheses'] == 2
          assert r['grid']['cells_evaluated'] == 2
          assert r['locked_internal_validation_opened'] is False
          assert r['retrospective_extension_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY
      - name: Deterministic multi-agent guard
        run: |
          if command -v orderflow-multi-agent >/dev/null 2>&1; then
            orderflow-multi-agent --output artifacts/gold_silver_macro_conditioned_relative_value_v4/multi_agent_report.json
            python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_silver_macro_conditioned_relative_value_v4/multi_agent_report.json'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit(r['release_manager']['next_actions'])
          PY
          else
            echo '{"status":"not_installed_in_minimal_research_runtime"}' > artifacts/gold_silver_macro_conditioned_relative_value_v4/multi_agent_report.json
          fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-silver-macro-conditioned-relative-value-v4
          path: artifacts/gold_silver_macro_conditioned_relative_value_v4/
          retention-days: 30
          if-no-files-found: warn
