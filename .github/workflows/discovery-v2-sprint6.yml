name: Discovery v2 Sprint 6

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint6]
    paths:
      - 'config/discovery_v2_sprint6_v1.json'
      - 'src/orderflow_edge_lab/discovery_v2_sprint6.py'
      - 'scripts/discovery_v2_sprint6.py'
      - 'tests/test_discovery_v2_sprint6.py'
      - '.github/workflows/discovery-v2-sprint6.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run Sprint 6 guardrails before market data
        run: python -m pytest -q tests/test_discovery_v2_sprint6.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen Sprint 6 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_sprint6_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_MARKET_RESULTS'
          assert p['execution']['leverage']==1.0
          assert p['execution']['transaction_cost_bps_per_side_on_turnover']==10.0
          assert p['trial_accounting']['directional_candidate_variants_added_this_sprint']==12
          assert p['trial_accounting']['all_12_variants_count'] is True
          assert p['trial_accounting']['sequential_discovery_debt_acknowledged'] is True
          assert p['trial_accounting']['no_prior_sprint_failure_or_success_reduces_this_sprints_thresholds'] is True
          assert p['trial_accounting']['no_grid_expansion_after_results'] is True
          assert p['claims']['persistent_edge_established'] is False
          assert p['claims']['live_execution_supported'] is False
          print('Frozen Sprint 6 contract verified.')
          PY
      - name: Run frozen D0 falsification sprint
        run: python scripts/discovery_v2_sprint6.py --protocol config/discovery_v2_sprint6_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint6/results
      - name: Enforce result-state boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint6/results/sprint6_report.json').read_text())
          assert r['protocol_freeze_commit']=='82dd1e547a0f27426fbbc9248f8740ee461a45cb'
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_execution_supported'] is False
          for name,f in r['families'].items(): assert f['state'] in {'FALSIFIED','REPLICATION_PENDING'}, (name,f['state'])
          print({k:v['state'] for k,v in r['families'].items()})
          PY
      - name: Upload immutable Sprint 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint6-v1
          path: |
            config/discovery_v2_sprint6_v1.json
            research/discovery_v2/sprint6/results/
          retention-days: 30
          if-no-files-found: warn
