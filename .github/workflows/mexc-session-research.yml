name: MEXC Trading Session Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: read

jobs:
  session-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run rolling 30-day MEXC session study
        shell: bash
        run: |
          set -euo pipefail
          END="$(date -u +%Y-%m-%dT00:00:00Z)"
          START="$(date -u -d '30 days ago' +%Y-%m-%dT00:00:00Z)"
          mkdir -p artifacts/session_research
          orderflow-mexc-session-research             --start "$START"             --end "$END"             --symbol ENA_USDT             --symbol BTC_USDT             --interval 15m             --output artifacts/session_research/mexc_session_30d.json
      - name: Preserve session study
        uses: actions/upload-artifact@v4
        with:
          name: mexc-session-research-30d
          path: artifacts/session_research/mexc_session_30d.json
          if-no-files-found: error
          retention-days: 30
