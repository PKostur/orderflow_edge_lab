name: Strategy Discovery v4 Carry Eval

on:
  workflow_dispatch:
  push:
    branches: [research/strategy-discovery-v4-carry-eval]
    paths:
      - "config/strategy_discovery_v4_carry_eval_amendment.json"
      - "scripts/run_carry_v4_development.py"
      - "research/strategy_discovery_v4_carry/development_precheck_summary.json"
      - ".github/workflows/strategy-discovery-v4-carry-eval.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy-discovery-v4-carry-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator runtime
        run: python -m pip install pandas numpy
      - name: Download exact immutable carry dataset
        uses: actions/download-artifact@v4
        with:
          name: strategy-discovery-v4-carry-data
          path: artifacts/strategy_discovery_v4_carry/data
          github-token: ${{ github.token }}
          repository: PKostur/orderflow_edge_lab
          run-id: 34875908501
      - name: Run development-only carry tournament
        run: |
          python scripts/run_carry_v4_development.py \
            --data-dir artifacts/strategy_discovery_v4_carry/data \
            --output artifacts/strategy_discovery_v4_carry/development_results.json
      - name: Exact precheck reproduction and claim guard
        run: |
          python - <<'PY'
          import json, math
          got=json.load(open('artifacts/strategy_discovery_v4_carry/development_results.json', encoding='utf-8'))
          exp=json.load(open('research/strategy_discovery_v4_carry/development_precheck_summary.json', encoding='utf-8'))
          exact={
              'single_symbol_cells':122,
              'cross_sectional_cells':18,
              'state_pass_single_symbol':10,
              'state_pass_cross_sectional':18,
              'preliminary_development_pass_single_symbol':0,
              'preliminary_development_pass_cross_sectional':0,
          }
          for k,v in exact.items():
              if got.get(k)!=v:
                  raise SystemExit(f'{k}: expected {v}, got {got.get(k)}')
          b=got['best_cross_sectional']
          if b['params'] != {'k':2,'nsett':5,'hold':72}:
              raise SystemExit(f"unexpected best xsec params: {b['params']}")
          checks={
              'state_median_rho':0.23089158637620416,
              'state_posfold':0.8666666666666667,
              'primary_median_fold_net':6.757970357024187,
              'primary_median_fold_pf':1.1297613939956916,
              'primary_posfold':0.5333333333333333,
              'high_median_fold_net':2.757970357024187,
          }
          for k,v in checks.items():
              if not math.isclose(float(b[k]), v, rel_tol=1e-10, abs_tol=1e-10):
                  raise SystemExit(f'best xsec {k}: expected {v}, got {b[k]}')
          if got['holdout_opened'] or got['leverage_tested']:
              raise SystemExit('holdout/leverage must remain sealed')
          if any(got['claims'].values()):
              raise SystemExit(f"claim escalation: {got['claims']}")
          print('canonical v4 carry development result reproduces frozen precheck exactly')
          PY
      - name: Deterministic release-manager guard
        run: |
          python -m pip install -e ".[research]"
          orderflow-multi-agent --output artifacts/strategy_discovery_v4_carry/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/strategy_discovery_v4_carry/multi_agent_report.json', encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit(r['release_manager']['next_actions'])
          PY
      - name: Preserve canonical carry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v4-carry-eval
          path: artifacts/strategy_discovery_v4_carry/
          retention-days: 30
          if-no-files-found: error
