name: Cross-Sectional Independent Venue Replication v1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "src/orderflow_edge_lab/binance_history.py"
      - "src/orderflow_edge_lab/cross_sectional_venue_replication.py"
      - "src/orderflow_edge_lab/cli/cross_sectional_venue_replication.py"
      - "tests/test_cross_sectional_venue_replication.py"
      - "config/cross_sectional_venue_replication_v1.json"
      - ".github/workflows/cross-sectional-venue-replication-v1.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run venue-replication tests
        run: python -m unittest tests.test_cross_sectional_venue_replication -v
      - name: Run MEXC versus Binance USD-M replication
        run: |
          mkdir -p artifacts/cross_sectional_venue_replication/source
          orderflow-cross-sectional-venue-replication \
            --candidate config/cross_sectional_candidate_v1.json \
            --config config/cross_sectional_venue_replication_v1.json \
            --output artifacts/cross_sectional_venue_replication/report.json \
            --source-dir artifacts/cross_sectional_venue_replication/source \
            --max-workers 5
      - name: Enforce D2 evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/cross_sectional_venue_replication/report.json",encoding="utf-8"))
          if r["evidence_independence"] != "D2_independent_venue_same_historical_period":
              raise SystemExit("wrong evidence level")
          if r["formal_verdict"] != "DESCRIPTIVE_TRANSFER_ONLY":
              raise SystemExit("replication emitted evaluative verdict")
          c=r["claims"]
          if c["strategy_definition_changed"] or c["same_historical_period_is_future_oos"]:
              raise SystemExit("replication boundary violated")
          if c["independent_venue_is_independent_engine"]:
              raise SystemExit("venue replication mislabeled as engine replication")
          if c["candidate_promoted"] or c["profitable_edge_established"] or c["live_trading_authorized"] or c["leverage_authorized"]:
              raise SystemExit("forbidden claim")
          print(json.dumps({
              "shared_daily_observations":r["shared_daily_observations"],
              "shared_start":r["shared_start"],
              "shared_end":r["shared_end"],
              "mexc_net_return":r["mexc"]["net_return"],
              "binance_net_return":r["binance_usdm"]["net_return"],
              "mexc_median_fold_return":r["mexc"]["median_fold_return"],
              "binance_median_fold_return":r["binance_usdm"]["median_fold_return"],
              "signal_agreement":r["signal_agreement"],
          },indent=2))
          PY
      - name: Preserve venue-replication artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-independent-venue-replication-v1
          path: artifacts/cross_sectional_venue_replication/
          retention-days: 90
          if-no-files-found: error
