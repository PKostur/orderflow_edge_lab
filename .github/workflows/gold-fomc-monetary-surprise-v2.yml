name: Gold FOMC Monetary Surprise v2

on:
  workflow_dispatch:
  push:
    branches: [research/gold-fomc-monetary-surprise-v2]
    paths:
      - "config/gold_fomc_monetary_surprise_v2.json"
      - "scripts/run_gold_fomc_monetary_surprise_v2.py"
      - ".github/workflows/gold-fomc-monetary-surprise-v2.yml"

permissions:
  contents: read

concurrency:
  group: gold-fomc-monetary-surprise-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install pandas numpy openpyxl

      - name: Fetch pinned XAUUSD M15 and audited SF Fed surprise workbook
        run: |
          set -euo pipefail
          root=artifacts/gold_fomc_monetary_surprise_v2
          mkdir -p "$root/data"
          base="https://raw.githubusercontent.com/simom1/XAUUSD-history/bda79c6c5ce09a5b488d4cd2c20fcd19bdd2ed3a"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$base/Gold-Cash/XAUUSD/XAUUSD_M15_2010_2026.csv" \
            -o "$root/data/XAUUSD_M15.csv"
          curl --fail --location --retry 4 --retry-delay 3 -A "Mozilla/5.0" \
            "https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises-data.xlsx" \
            -o "$root/data/monetary-policy-surprises-data.xlsx"
          echo "708606624de050cdaf6fd850a320b38d45099ab7c2398e01ba12dcece5743668  $root/data/monetary-policy-surprises-data.xlsx" | sha256sum -c -
          sha256sum "$root/data/XAUUSD_M15.csv" "$root/data/monetary-policy-surprises-data.xlsx" \
            > "$root/data/SHA256SUMS.txt"

      - name: Run frozen development experiment
        run: |
          python scripts/run_gold_fomc_monetary_surprise_v2.py \
            --config config/gold_fomc_monetary_surprise_v2.json \
            --gold artifacts/gold_fomc_monetary_surprise_v2/data/XAUUSD_M15.csv \
            --surprises artifacts/gold_fomc_monetary_surprise_v2/data/monetary-policy-surprises-data.xlsx \
            --output artifacts/gold_fomc_monetary_surprise_v2/result.json

      - name: Guard research boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/gold_fomc_monetary_surprise_v2/result.json'))
          assert r['protocol'] == 'gold_fomc_monetary_surprise_v2'
          assert r['grid']['cells_evaluated'] == 4
          assert r['data_integrity']['development_regular_fomc_events'] == 39
          assert r['data_integrity']['development_raw_surprise_non_null'] == 39
          assert r['data_integrity']['development_orth_surprise_non_null'] == 33
          assert r['locked_internal_validation_opened'] is False
          assert r['retrospective_extension_opened'] is False
          assert r['leverage_tested'] is False
          assert r['claims']['verified_future_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['leverage_authorized'] is False
          assert r['claims']['live_enabled'] is False
          PY

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-fomc-monetary-surprise-v2
          path: artifacts/gold_fomc_monetary_surprise_v2/
          retention-days: 30
          if-no-files-found: warn
