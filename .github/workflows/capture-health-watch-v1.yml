name: Capture Health Watch v1

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
  pull_request:
    paths:
      - "src/orderflow_edge_lab/capture_health.py"
      - "src/orderflow_edge_lab/cli/capture_health.py"
      - "tests/test_capture_health.py"
      - ".github/workflows/capture-health-watch-v1.yml"

permissions:
  contents: read

jobs:
  capture-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run capture-health unit tests
        run: python -m unittest tests.test_capture_health -v
      - name: Produce capture health summary
        env:
          CAPTURE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/captures
        run: |
          mkdir -p artifacts
          orderflow-capture-health --data-dir "$CAPTURE_ARTIFACT_DIR" --output artifacts/capture_health.json || true
          cat artifacts/capture_health.json
      - name: Report findings without failing the runner
        if: always()
        run: |
          python - <<'PY'
          import json, os
          path = 'artifacts/capture_health.json'
          if not os.path.isfile(path):
              print('no capture health report produced; nothing to flag')
              raise SystemExit(0)
          report = json.load(open(path, encoding='utf-8'))
          print('data_dir_exists:', report['data_dir_exists'])
          print('capture_counts:', report['capture_counts'])
          print('stale:', report['stale'], '| newest:', report['newest_capture_started_utc'])
          for finding in report['findings']:
              print(f"[{finding['severity']}] {finding['code']}: {finding['detail']}")
          if not report['claims']['live_order_transmission_supported'] is False:
              raise SystemExit('capture health claims were tampered with')
          print('capture-health report is reporting-only; live boundary intact')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-health-watch
          path: artifacts/capture_health.json
          if-no-files-found: warn
          retention-days: 30
