name: Fibonacci HTF Robustness v1

on:
  workflow_dispatch:
  push:
    branches: [research/fibonacci-htf-robustness-v1]

permissions:
  contents: read

concurrency:
  group: fibonacci-htf-robustness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fibonacci-htf-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research runtime
        run: python -m pip install -e ".[research]"

      - name: Compile frozen parent and robustness runner
        run: |
          python -m py_compile scripts/fibonacci_setup_quality_v1.py
          python -m py_compile scripts/fibonacci_htf_robustness_v1.py

      - name: Verify robustness protocol does not retune parent Fib rules
        run: |
          python - <<'PY'
          import json
          parent=json.load(open('config/fibonacci_setup_quality_v1.json', encoding='utf-8'))
          robust=json.load(open('config/fibonacci_htf_robustness_v1.json', encoding='utf-8'))
          p=parent['fibonacci_definition']
          r=robust['frozen_fibonacci']
          assert r['anchor_lookback_bars'] == p['anchor_lookback_bars']
          assert r['minimum_impulse_atr'] == p['minimum_impulse_atr']
          assert r['level_tolerance'] == p['level_tolerance']
          assert r['fib_core_levels'] == p['overlays']['fib_core']['levels']
          assert r['matched_nonfib_levels'] == p['overlays']['nonfib_matched_control']['levels']
          assert robust['frozen_strategy']['parameters'] == parent['htf_trend']['parameters']
          assert robust['data']['symbols'] == parent['data']['htf_symbols']
          assert robust['data']['start'] == parent['data']['htf_funding_complete_start']
          assert robust['data']['end_exclusive'] == parent['data']['end_exclusive']
          PY

      - name: Run frozen HTF Fib robustness diagnostics
        run: |
          mkdir -p artifacts/fibonacci_htf_robustness_v1
          python scripts/fibonacci_htf_robustness_v1.py \
            --config config/fibonacci_htf_robustness_v1.json \
            --output artifacts/fibonacci_htf_robustness_v1/report.json \
            --max-workers 6

      - name: Verify claims and complete diagnostic coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/fibonacci_htf_robustness_v1/report.json', encoding='utf-8'))
          assert r['protocol_name'] == 'fibonacci-htf-robustness-v1'
          assert set(r['symbols']) == {
              'BTC_USDT','ETH_USDT','SOL_USDT','XRP_USDT','DOGE_USDT',
              'BNB_USDT','ADA_USDT','LINK_USDT','SUI_USDT','ENA_USDT'
          }
          overlays={row['overlay'] for row in r['aggregate_cells']}
          assert overlays == {'baseline','fib_core','nonfib_matched_control'}
          assert len(r['aggregate_cells']) == 9
          dims={row['dimension'] for row in r['slice_cells']}
          assert dims == {'symbol','fold_id','btc_trend_regime','btc_volatility_regime'}
          primary=r['primary_robustness']
          assert len(primary['leave_one_symbol_out']) == 10
          assert len(primary['leave_one_fold_out']) >= 4
          assert r['claims']['verified_out_of_sample_evidence'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['live_order_transmission_supported'] is False
          print(json.dumps({
              'fib_core_concentration': primary['fib_core_setup_concentration'],
              'leave_one_symbol_out': primary['leave_one_symbol_out'],
              'leave_one_fold_out': primary['leave_one_fold_out'],
          }, indent=2))
          PY

      - name: Deterministic multi-agent release-manager check
        run: |
          orderflow-multi-agent --output artifacts/fibonacci_htf_robustness_v1/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/fibonacci_htf_robustness_v1/multi_agent_report.json', encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked Fibonacci HTF robustness lane')
          PY

      - name: Upload complete robustness evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibonacci-htf-robustness-v1
          path: artifacts/fibonacci_htf_robustness_v1/
          retention-days: 30
          if-no-files-found: error
