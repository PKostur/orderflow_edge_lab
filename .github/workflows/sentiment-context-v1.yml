name: Sentiment Context Specialist v1

on:
  pull_request:
    branches: [main]
    paths:
      - "config/sentiment_monitor_v1.json"
      - "config/sentiment_conditioning_v1.json"
      - "config/multi_agents.json"
      - "src/orderflow_edge_lab/sentiment_monitor.py"
      - "src/orderflow_edge_lab/cli/sentiment_monitor.py"
      - "tests/test_sentiment_monitor.py"
      - "tests/test_multi_agent.py"
      - "pyproject.toml"
      - ".github/workflows/sentiment-context-v1.yml"
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: sentiment-context-v1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Validate frozen observation and conditioning boundaries
        run: |
          python - <<'PY'
          import json
          monitor=json.load(open('config/sentiment_monitor_v1.json',encoding='utf-8'))
          cond=json.load(open('config/sentiment_conditioning_v1.json',encoding='utf-8'))
          assert monitor['protocol_name'] == 'sentiment-monitor-v1'
          assert monitor['status'] == 'forward_observational'
          assert monitor['claims']['sentiment_is_strategy_filter'] is False
          assert monitor['claims']['eligible_as_strategy_filter'] is False
          assert monitor['claims']['live_order_transmission_supported'] is False
          assert monitor['state_readiness']['strategy_pnl_may_affect_readiness'] is False
          assert cond['protocol_name'] == 'sentiment-conditioning-v1'
          assert cond['status'] == 'frozen_inactive_until_state_qualification'
          assert cond['activation_gates']['strategy_pnl_may_select_sentiment_state'] is False
          assert cond['conditioning_mapping']['may_create_new_entries'] is False
          assert cond['conditioning_mapping']['may_reverse_existing_signal'] is False
          assert cond['claims']['active_strategy_filter'] is False
          assert cond['claims']['backtest_authorized_now'] is False
          assert cond['claims']['live_order_transmission_supported'] is False
          PY
      - name: Run sentiment specialist tests
        run: python -m unittest tests.test_sentiment_monitor -v
      - name: Run deterministic release-manager gate
        run: |
          orderflow-multi-agent --output artifacts/sentiment_validation_multi_agent.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_validation_multi_agent.json',encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked sentiment specialist')
          PY

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Screen liquid MEXC perpetuals without strategy PnL
        run: |
          mkdir -p artifacts/sentiment_context
          orderflow-pair-screen \
            --top 18 \
            --max-spread-bps 5 \
            --min-turnover-usdt 10000000 \
            --output artifacts/sentiment_context/pair_screen.json
      - name: Build BTC-correlation-diversified sentiment panel
        run: |
          orderflow-correlation-panel \
            artifacts/sentiment_context/pair_screen.json \
            --lookback-hours 72 \
            --interval Min5 \
            --min-samples 200 \
            --panel-size 6 \
            --high-positive-min 0.65 \
            --low-absolute-max 0.25 \
            --high-target 2 \
            --low-target 2 \
            --output artifacts/sentiment_context/correlation_panel.json
      - name: Recover prior successful sentiment ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentiment_previous artifacts/sentiment_context
          PREV_ID=""
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID; do
            [[ -z "${ARTIFACT_ID:-}" || -z "${RUN_ID:-}" ]] && continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)"
            if [[ "$CONCLUSION" == "success" ]]; then PREV_ID="$ARTIFACT_ID"; break; fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sentiment-context-ledger-v1&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[] | [.id,.workflow_run.id] | @tsv' || true)
          if [[ -n "$PREV_ID" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}/zip" > /tmp/sentiment_previous.zip
            unzip -q /tmp/sentiment_previous.zip -d /tmp/sentiment_previous
            PRIOR="$(find /tmp/sentiment_previous -type f -name 'sentiment_ledger.json' -print -quit || true)"
            if [[ -n "$PRIOR" ]]; then cp "$PRIOR" artifacts/sentiment_context/prior_ledger.json; fi
          fi
      - name: Collect and score public headline sentiment
        shell: bash
        run: |
          set -euo pipefail
          PRIOR_ARGS=()
          if [[ -f artifacts/sentiment_context/prior_ledger.json ]]; then
            PRIOR_ARGS+=(--prior-ledger artifacts/sentiment_context/prior_ledger.json)
          fi
          orderflow-sentiment-monitor \
            --panel artifacts/sentiment_context/correlation_panel.json \
            --protocol config/sentiment_monitor_v1.json \
            --snapshot-output artifacts/sentiment_context/current_snapshot.json \
            --output artifacts/sentiment_context/sentiment_ledger.json \
            "${PRIOR_ARGS[@]}"
      - name: Verify sentiment remains observational
        run: |
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_context/sentiment_ledger.json',encoding='utf-8'))
          claims=report['claims']
          assert claims['research_only'] is True
          assert claims['observational_only'] is True
          assert claims['sentiment_is_strategy_filter'] is False
          assert claims['eligible_as_strategy_filter'] is False
          assert claims['profitable_edge_established'] is False
          assert claims['live_order_transmission_supported'] is False
          print(json.dumps({
              'events': report['summary']['event_count'],
              'non_neutral': report['summary']['non_neutral_event_count'],
              'independent_clusters': report['summary']['independent_event_cluster_count'],
              'state_screen_ready': report['summary']['state_screen_ready'],
          }, indent=2))
          PY
      - name: Deterministic release-manager integrity check
        run: |
          orderflow-multi-agent --output artifacts/sentiment_context/multi_agent_report.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_context/multi_agent_report.json',encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked sentiment evidence collection')
          PY
      - name: Preserve cumulative sentiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-context-ledger-v1
          path: |
            artifacts/sentiment_context/sentiment_ledger.json
            artifacts/sentiment_context/current_snapshot.json
            artifacts/sentiment_context/pair_screen.json
            artifacts/sentiment_context/correlation_panel.json
            artifacts/sentiment_context/multi_agent_report.json
            config/sentiment_monitor_v1.json
            config/sentiment_conditioning_v1.json
          retention-days: 90
          if-no-files-found: error
      - name: Delete superseded cumulative sentiment ledgers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IDS < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sentiment-context-ledger-v1&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[1:] | .[].id' || true)
          for ID in "${IDS[@]}"; do
            [[ -z "$ID" ]] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" || true
          done
