name: Sentiment Context Specialist v1.1

on:
  pull_request:
    branches: [main]
    paths:
      - "config/sentiment_monitor_v1_1.json"
      - "config/sentiment_conditioning_v1_1.json"
      - "src/orderflow_edge_lab/sentiment_monitor_v1_1.py"
      - "src/orderflow_edge_lab/cli/sentiment_monitor_v1_1.py"
      - "tests/test_sentiment_monitor_v1_1.py"
      - ".github/workflows/sentiment-context-v1.yml"
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: sentiment-context-v1-1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Validate frozen v1.1 protocol and fixed strategy universe
        run: |
          python - <<'PY'
          import json
          monitor=json.load(open('config/sentiment_monitor_v1_1.json',encoding='utf-8'))
          cond=json.load(open('config/sentiment_conditioning_v1_1.json',encoding='utf-8'))
          expected={'ETH_USDT','SOL_USDT','XRP_USDT','DOGE_USDT','BNB_USDT','ADA_USDT','LINK_USDT','SUI_USDT','ENA_USDT'}
          assert monitor['protocol_name'] == 'sentiment-monitor-v1.1'
          assert monitor['supersedes'] == 'sentiment-monitor-v1'
          assert monitor['status'] == 'forward_observational'
          assert set(monitor['observation_universe']['strategy_conditioning_symbols']) == expected
          assert set(monitor['observation_universe']['readiness_symbols']) == expected
          assert monitor['observation_universe']['context_only_symbols'] == ['BTC_USDT']
          assert monitor['observation_universe']['strategy_pnl_used_for_universe_selection'] is False
          assert monitor['observation_universe']['dynamic_cross_pair_panel_used_for_readiness'] is False
          assert monitor['claims']['v1_evidence_reused'] is False
          assert monitor['claims']['sentiment_is_strategy_filter'] is False
          assert monitor['claims']['eligible_as_strategy_filter'] is False
          assert monitor['claims']['live_order_transmission_supported'] is False
          assert cond['protocol_name'] == 'sentiment-conditioning-v1.1'
          assert cond['supersedes'] == 'sentiment-conditioning-v1'
          assert cond['sentiment_protocol'] == 'sentiment-monitor-v1.1'
          assert cond['conditioning_mapping']['btc_leg_may_be_conditioned'] is False
          assert cond['conditioning_mapping']['may_create_new_entries'] is False
          assert cond['conditioning_mapping']['may_reverse_existing_signal'] is False
          assert cond['claims']['v1_sentiment_evidence_reused'] is False
          assert cond['claims']['active_strategy_filter'] is False
          assert cond['claims']['backtest_authorized_now'] is False
          assert cond['claims']['live_order_transmission_supported'] is False
          PY
      - name: Validate both public headline feeds are parseable now
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from orderflow_edge_lab.news_monitor import parse_feed
          p=json.load(open('config/sentiment_monitor_v1_1.json',encoding='utf-8'))
          for source in p['sources']:
              req=Request(source['url'],headers={'Accept':'application/rss+xml, application/atom+xml, application/xml, text/xml, */*','User-Agent':'orderflow-edge-lab/1.0 research-news-monitor'})
              with urlopen(req,timeout=20) as r:
                  raw=r.read(8_000_000)
              rows=parse_feed(source['name'],raw)
              if not rows:
                  raise SystemExit(f"{source['name']} returned no parseable feed items")
              print(source['name'], len(rows))
          PY
      - name: Run sentiment specialist tests
        run: python -m unittest tests.test_sentiment_monitor tests.test_sentiment_monitor_v1_1 -v
      - name: Run deterministic release-manager gate
        run: |
          orderflow-multi-agent --output artifacts/sentiment_validation_multi_agent.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_validation_multi_agent.json',encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked sentiment specialist v1.1')
          PY

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Recover prior successful v1.1 sentiment ledger only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentiment_previous artifacts/sentiment_context
          PREV_ID=""
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID; do
            [[ -z "${ARTIFACT_ID:-}" || -z "${RUN_ID:-}" ]] && continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)"
            if [[ "$CONCLUSION" == "success" ]]; then PREV_ID="$ARTIFACT_ID"; break; fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sentiment-context-ledger-v1-1&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[] | [.id,.workflow_run.id] | @tsv' || true)
          if [[ -n "$PREV_ID" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}/zip" > /tmp/sentiment_previous.zip
            unzip -q /tmp/sentiment_previous.zip -d /tmp/sentiment_previous
            PRIOR="$(find /tmp/sentiment_previous -type f -name 'sentiment_ledger.json' -print -quit || true)"
            if [[ -n "$PRIOR" ]]; then cp "$PRIOR" artifacts/sentiment_context/prior_ledger.json; fi
          fi
      - name: Collect strategy-aligned public headline sentiment v1.1
        shell: bash
        run: |
          set -euo pipefail
          PRIOR_ARGS=()
          if [[ -f artifacts/sentiment_context/prior_ledger.json ]]; then
            PRIOR_ARGS+=(--prior-ledger artifacts/sentiment_context/prior_ledger.json)
          fi
          python -m orderflow_edge_lab.cli.sentiment_monitor_v1_1 \
            --protocol config/sentiment_monitor_v1_1.json \
            --snapshot-output artifacts/sentiment_context/current_snapshot.json \
            --output artifacts/sentiment_context/sentiment_ledger.json \
            "${PRIOR_ARGS[@]}"
      - name: Verify sentiment remains observational
        run: |
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_context/sentiment_ledger.json',encoding='utf-8'))
          assert report['protocol_name'] == 'sentiment-monitor-v1.1'
          claims=report['claims']
          assert claims['research_only'] is True
          assert claims['observational_only'] is True
          assert claims['sentiment_is_strategy_filter'] is False
          assert claims['eligible_as_strategy_filter'] is False
          assert claims['v1_evidence_reused'] is False
          assert claims['profitable_edge_established'] is False
          assert claims['live_order_transmission_supported'] is False
          summary=report['summary']
          print(json.dumps({
              'events': summary['event_count'],
              'readiness_events': summary['readiness_event_count'],
              'non_neutral': summary['non_neutral_event_count'],
              'sources': summary['distinct_sources'],
              'conditioning_symbols': summary['distinct_conditioning_symbols'],
              'independent_clusters': summary['independent_event_cluster_count'],
              'state_screen_ready': summary['state_screen_ready'],
          }, indent=2))
          PY
      - name: Deterministic release-manager integrity check
        run: |
          orderflow-multi-agent --output artifacts/sentiment_context/multi_agent_report.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/sentiment_context/multi_agent_report.json',encoding='utf-8'))
          if report['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked sentiment evidence collection')
          PY
      - name: Preserve cumulative sentiment v1.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-context-ledger-v1-1
          path: |
            artifacts/sentiment_context/sentiment_ledger.json
            artifacts/sentiment_context/current_snapshot.json
            artifacts/sentiment_context/multi_agent_report.json
            config/sentiment_monitor_v1_1.json
            config/sentiment_conditioning_v1_1.json
          retention-days: 90
          if-no-files-found: error
      - name: Delete superseded cumulative sentiment v1.1 ledgers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IDS < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sentiment-context-ledger-v1-1&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[1:] | .[].id' || true)
          for ID in "${IDS[@]}"; do
            [[ -z "$ID" ]] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" || true
          done
