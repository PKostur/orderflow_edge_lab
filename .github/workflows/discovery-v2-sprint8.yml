name: Discovery v2 Sprint 8 Regime Gated

on:
  workflow_dispatch:
  push:
    branches: [research/discovery-v2-sprint8-regime-gated]
    paths:
      - 'config/discovery_v2_sprint8_regime_gated_v1.json'
      - 'src/orderflow_edge_lab/discovery_v2_sprint8.py'
      - 'scripts/discovery_v2_sprint8.py'
      - 'tests/test_discovery_v2_sprint8.py'
      - '.github/workflows/discovery-v2-sprint8.yml'

permissions:
  contents: read

concurrency:
  group: discovery-v2-sprint8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Run Sprint 8 guardrails before market data
        run: python -m pytest -q tests/test_discovery_v2_sprint8.py tests/test_discovery_v2_evaluation.py
      - name: Verify frozen Sprint 8 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/discovery_v2_sprint8_regime_gated_v1.json').read_text())
          assert p['status']=='FROZEN_BEFORE_MARKET_RESULTS'
          assert p['origin']['evidence_level']=='D0_POST_DIAGNOSTIC_CONTAMINATED'
          assert p['regime_classifier']['changed_from_original_freeze'] is False
          assert p['regime_classifier']['state_at_execution_open_uses_information_through']=='previous completed UTC daily close'
          assert p['execution']['common_comparison_warmup_days']==90
          assert p['execution']['leverage']==1.0
          assert p['execution']['transaction_cost_bps_per_side_on_actual_turnover']==10.0
          assert p['trial_accounting']['directional_candidate_variants_added_this_sprint']==8
          assert p['trial_accounting']['all_8_variants_count'] is True
          assert p['trial_accounting']['complement_regime_controls_count_as_controls'] is True
          assert p['family_falsification_gate']['minimum_candidate_minus_complement_regime_control_mean_bps']==5.0
          assert p['data']['no_2025_data_for_discovery'] is True
          assert p['claims']['persistent_edge_established'] is False
          assert p['claims']['regime_router_supported'] is False
          print('Frozen Sprint 8 contract verified.')
          PY
      - name: Run frozen D0 regime-gated falsification sprint
        run: python scripts/discovery_v2_sprint8.py --protocol config/discovery_v2_sprint8_regime_gated_v1.json --evaluation config/discovery_v2_evaluation_v1.json --output-dir research/discovery_v2/sprint8/results
      - name: Enforce result-state boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/sprint8/results/sprint8_report.json').read_text())
          assert r['protocol_freeze_commit']=='08bf965cb9b1cd22befd7c0bcdaa21ea48ef097c'
          assert r['independence_level']=='D0_POST_DIAGNOSTIC_CONTAMINATED'
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['same_period_regime_result_is_validation'] is False
          assert r['claims']['live_execution_supported'] is False
          for name,f in r['families'].items():
              assert f['state'] in {'FALSIFIED','REPLICATION_PENDING'}, (name,f['state'])
              if f['state']=='REPLICATION_PENDING':
                  assert f['sprint8_selected_beats_complement_by_5bps'] is True
                  assert f['sprint8_selected_variant'] is not None
          print({k:v['state'] for k,v in r['families'].items()})
          PY
      - name: Upload immutable Sprint 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-sprint8-regime-gated-v1
          path: |
            config/discovery_v2_sprint8_regime_gated_v1.json
            research/discovery_v2/sprint8/results/
          retention-days: 30
          if-no-files-found: warn
