name: DV2 Residual Momentum D4 Shadow

on:
  workflow_dispatch:
  push:
    branches: [research/dv2-residual-momentum-beta45-v1]
    paths:
      - 'config/dv2_residual_momentum_beta45_d4_v1.json'
      - 'src/orderflow_edge_lab/residual_momentum_forward.py'
      - 'scripts/dv2_residual_momentum_d4.py'
      - 'tests/test_residual_momentum_forward.py'
      - '.github/workflows/dv2-residual-momentum-d4.yml'
  schedule:
    - cron: '35 0 * * *'

permissions:
  contents: read

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e '.[research]' pytest
      - name: Guard forward accounting before market data
        run: python -m pytest -q tests/test_residual_momentum_forward.py tests/test_discovery_v2_sprint1.py
      - name: Verify immutable D4 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/dv2_residual_momentum_beta45_d4_v1.json').read_text())
          assert p['candidate_id']=='dv2_btc_residual_momentum_beta45_v1'
          assert p['forward_start_utc']=='2026-09-17T00:00:00Z'
          assert p['flat_start'] is True and p['no_pre_start_backfill'] is True
          assert p['review']['minimum_completed_portfolio_periods']==30
          assert p['immutability']['no_live_execution'] is True
          print('D4 boundary verified')
          PY
      - name: Run prospective shadow
        run: python scripts/dv2_residual_momentum_d4.py
      - name: Enforce claims boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/discovery_v2/residual_momentum_beta45/d4_shadow/D4_REPORT.json').read_text())
          assert r['claims']['paper_shadow_only'] is True
          assert r['claims']['persistent_edge_established'] is False
          assert r['claims']['live_eligible'] is False
          assert r['claims']['no_pre_start_backfill'] is True
          print(r['state'], r['exact_candidate']['completed_periods'], r['exact_candidate']['pnl_per_1000'])
          PY
      - name: Upload immutable D4 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dv2-residual-momentum-beta45-d4-shadow
          path: |
            config/dv2_residual_momentum_beta45_v1.json
            config/dv2_residual_momentum_beta45_d4_v1.json
            research/discovery_v2/residual_momentum_beta45/d4_shadow/
          retention-days: 45
