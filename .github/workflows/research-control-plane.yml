name: Research Control Plane Status\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - fix/universal-existing-validation\n    paths:\n      - "src/orderflow_edge_lab/research_control_plane.py"\n      - "src/orderflow_edge_lab/cli/research_control_plane.py"\n      - "tests/test_research_control_plane.py"\n      - ".github/workflows/research-control-plane.yml"\n      - "pyproject.toml"\n  schedule:\n    - cron: "5 1,9,17 * * *"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: research-control-plane-status\n  cancel-in-progress: true\n\njobs:\n  status:\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    env:\n      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install runtime\n        run: python -m pip install -e ".[research,jev]"\n      - name: Run control plane tests\n        run: python -m unittest tests.test_research_control_plane -v\n      - name: Build fresh shadow\n        run: |\n          mkdir -p artifacts/research_control_plane/source\n          orderflow-universal-session-shadow \\n            --config config/universal_session_alignment_shadow_v1.json \\n            --output artifacts/research_control_plane/shadow.json \\n            --source-dir artifacts/research_control_plane/source \\n            --max-workers 5\n      - name: Build Jev decision\n        run: |\n          orderflow-jev-research-decision \\n            --shadow-report artifacts/research_control_plane/shadow.json \\n            --output artifacts/research_control_plane/decision.json\n      - name: Execute bounded Jev action\n        run: |\n          orderflow-jev-research-action \\n            --shadow-report artifacts/research_control_plane/shadow.json \\n            --decision artifacts/research_control_plane/decision.json \\n            --output artifacts/research_control_plane/action.json\n      - name: Build operational monitor\n        run: |\n          orderflow-universal-shadow-monitor \\n            --config config/universal_session_alignment_shadow_v1.json \\n            --output artifacts/research_control_plane/operational.json \\n            --max-workers 5\n      - name: Build unified status\n        run: |\n          orderflow-research-control-plane \\n            --shadow-report artifacts/research_control_plane/shadow.json \\n            --decision artifacts/research_control_plane/decision.json \\n            --action artifacts/research_control_plane/action.json \\n            --operational artifacts/research_control_plane/operational.json \\n            --output artifacts/research_control_plane/status.json\n      - name: Enforce control-plane authority boundary\n        run: |\n          python - <<'PY'\n          import json\n          r=json.load(open("artifacts/research_control_plane/status.json",encoding="utf-8"))\n          claims=r["claims"]\n          if any(bool(claims.get(k)) for k in ("live_trading_authorized","leverage_authorized","strategy_promotion_authorized")):\n              raise SystemExit("control plane exceeded authority")\n          if not bool(claims.get("operational_telemetry_not_evidence")):\n              raise SystemExit("operational telemetry/evidence boundary lost")\n          if r["stage"] == "HALTED_PROTOCOL_BREACH":\n              raise SystemExit("research control plane halted on protocol breach")\n          print(json.dumps({\n              "as_of_utc":r["as_of_utc"],\n              "stage":r["stage"],\n              "shadow_status":r["shadow_status"],\n              "latest_execution_boundary_utc":r["latest_execution_boundary_utc"],\n              "execution_boundaries_since_start_including_start":r["execution_boundaries_since_start_including_start"],\n              "evidence":r["evidence"],\n              "operations":r["operations"],\n              "decision":r["decision"],\n          },indent=2))\n          PY\n      - name: Preserve control-plane artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: research-control-plane-status\n          path: artifacts/research_control_plane/\n          retention-days: 90\n          if-no-files-found: error\n