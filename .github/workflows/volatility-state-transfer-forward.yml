name: Volatility State D4 Forward Replication

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "src/orderflow_edge_lab/volatility_state_forward.py"
      - "src/orderflow_edge_lab/cli/volatility_state_forward.py"
      - "src/orderflow_edge_lab/cli/mexc_record.py"
      - "tests/test_volatility_state_forward.py"
      - "tests/test_mexc_record.py"
      - "config/volatility_state_transfer_forward_v1.json"
      - ".github/workflows/volatility-state-transfer-forward.yml"
      - "pyproject.toml"
  schedule:
    - cron: "35 1,7,13,19 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: volatility-state-transfer-forward-v1
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONFIG: config/volatility_state_transfer_forward_v1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run forward-watch tests
        run: |
          python -m unittest tests.test_volatility_state_forward -v
          python -m unittest tests.test_mexc_record -v
      - name: Check clean prospective boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          START=$(python -c 'import json,os; print(json.load(open(os.environ["CONFIG"]))["prospective_start_utc"])')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python - "$START" "$NOW" <<'PY'
          import sys
          from datetime import datetime
          start=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          now=datetime.fromisoformat(sys.argv[2].replace("Z","+00:00"))
          print(f"start={start.isoformat()} now={now.isoformat()} eligible={now >= start}")
          PY
          if [[ "$NOW" < "$START" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
      - name: Write pre-start status
        if: steps.boundary.outputs.eligible != 'true'
        run: |
          mkdir -p artifacts/volatility_state_forward
          python - <<'PY'
          import json, os
          cfg=json.load(open(os.environ["CONFIG"],encoding="utf-8"))
          payload={
            "schema_version":1,
            "analysis":"volatility_state_forward_prestart_v1",
            "watch_id":cfg["watch_id"],
            "prospective_start_utc":cfg["prospective_start_utc"],
            "status":"PRE_START",
            "formal_verdict":"WITHHELD",
            "claims":{"no_evidence_collected":True,"strategy_pnl_used":False},
          }
          json.dump(payload,open("artifacts/volatility_state_forward/prestart.json","w",encoding="utf-8"),indent=2)
          PY
      - name: Capture genuinely later multi-symbol order flow
        if: steps.boundary.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/volatility_state_forward/current
          orderflow-mexc-record \
            --symbol ARB_USDT \
            --symbol ETH_USDT \
            --symbol FIL_USDT \
            --symbol NEAR_USDT \
            --symbol SOL_USDT \
            --symbol UNI_USDT \
            --symbol BTC_USDT \
            --duration-seconds 600 \
            --output-dir artifacts/volatility_state_forward/current
      - name: Build causal state reports
        if: steps.boundary.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FEATURE=$(find artifacts/volatility_state_forward/current -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          mkdir -p artifacts/volatility_state_forward/current/state_reports
          CLUSTER_ID="gha-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          for SYMBOL in ARB_USDT ETH_USDT FIL_USDT NEAR_USDT SOL_USDT UNI_USDT; do
            orderflow-market-state-scan "$FEATURE" \
              --symbol "$SYMBOL" \
              --context-symbol BTC_USDT \
              --batch-id "$CLUSTER_ID" \
              --sample-seconds 5 \
              --directionality-horizons 60 \
              --volatility-horizons 30,60,300 \
              --liquidity-horizons 60 \
              --continuation-horizons 60 \
              --minimum-association-observations 20 \
              --output "artifacts/volatility_state_forward/current/state_reports/${SYMBOL}.json"
          done
      - name: Evaluate current D4 cluster
        if: steps.boundary.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_ID="gha-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          orderflow-volatility-state-forward cluster \
            artifacts/volatility_state_forward/current/state_reports/*.json \
            --config "$CONFIG" \
            --cluster-id "$CLUSTER_ID" \
            --output artifacts/volatility_state_forward/current/cluster.json
      - name: Restore prior forward ledger
        if: steps.boundary.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/volatility_state_forward/history
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=volatility-state-forward-ledger-v1&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty' || true)
          if [[ -n "$ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/vol-ledger.zip
            mkdir -p /tmp/vol-ledger
            unzip -q /tmp/vol-ledger.zip -d /tmp/vol-ledger
            if [[ -d /tmp/vol-ledger/history ]]; then
              cp -a /tmp/vol-ledger/history/. artifacts/volatility_state_forward/history/
            fi
          fi
      - name: Append current cluster and aggregate
        if: steps.boundary.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_ID=$(python -c 'import json; print(json.load(open("artifacts/volatility_state_forward/current/cluster.json"))["cluster_id"])')
          DEST="artifacts/volatility_state_forward/history/$CLUSTER_ID"
          mkdir -p "$DEST"
          cp artifacts/volatility_state_forward/current/cluster.json "$DEST/cluster.json"
          mapfile -t CLUSTERS < <(find artifacts/volatility_state_forward/history -type f -name cluster.json | sort)
          test "${#CLUSTERS[@]}" -ge 1
          orderflow-volatility-state-forward aggregate "${CLUSTERS[@]}" \
            --config "$CONFIG" \
            --output artifacts/volatility_state_forward/aggregate.json
      - name: Enforce evidence boundary
        if: steps.boundary.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          cfg=json.load(open(os.environ["CONFIG"],encoding="utf-8"))
          cluster=json.load(open("artifacts/volatility_state_forward/current/cluster.json",encoding="utf-8"))
          agg=json.load(open("artifacts/volatility_state_forward/aggregate.json",encoding="utf-8"))
          start=datetime.fromisoformat(cfg["prospective_start_utc"].replace("Z","+00:00"))
          first=datetime.fromisoformat(cluster["capture_first_observation_utc"])
          if first < start:
              raise SystemExit("pre-start observation entered D4 cluster")
          if cluster["formal_verdict"] != "WITHHELD" or agg["formal_verdict"] != "WITHHELD":
              raise SystemExit("early formal verdict")
          if not cluster["claims"]["simultaneous_symbols_count_as_one_dependence_cluster"]:
              raise SystemExit("dependence correction lost")
          for payload in (cluster,agg):
              claims=payload["claims"]
              if claims.get("strategy_pnl_used"):
                  raise SystemExit("strategy PnL entered state watch")
              if claims.get("profitable_edge_established") or claims.get("live_trading_authorized") or claims.get("leverage_authorized"):
                  raise SystemExit("authority/evidence boundary violated")
          print(json.dumps({
              "cluster_id":cluster["cluster_id"],
              "eligible_symbol_count":cluster["eligible_symbol_count"],
              "cluster_median_primary_spearman":cluster["cluster_median_primary_spearman"],
              "cluster_positive_symbol_fraction":cluster["cluster_positive_symbol_fraction"],
              "eligible_cluster_count":agg["eligible_cluster_count"],
              "review_progress":agg["review_progress"],
          },indent=2))
          PY
      - name: Preserve pre-start status
        if: steps.boundary.outputs.eligible != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: volatility-state-forward-prestart
          path: artifacts/volatility_state_forward/prestart.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve cumulative D4 ledger
        if: steps.boundary.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: volatility-state-forward-ledger-v1
          path: |
            artifacts/volatility_state_forward/history/
            artifacts/volatility_state_forward/aggregate.json
            artifacts/volatility_state_forward/current/cluster.json
            config/volatility_state_transfer_forward_v1.json
          retention-days: 90
          if-no-files-found: error
