name: Payoff Geometry Forward v1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "src/orderflow_edge_lab/payoff_geometry_forward.py"
      - "src/orderflow_edge_lab/cli/payoff_geometry_forward.py"
      - "tests/test_payoff_geometry_forward.py"
      - "config/payoff_geometry_forward_v1.json"
      - ".github/workflows/payoff-geometry-forward-v1.yml"
  schedule:
    - cron: "20 0,8,16 * * *"

permissions:
  contents: read

concurrency:
  group: payoff-geometry-forward-v1
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run forward-watch tests
        run: python -m unittest tests.test_payoff_geometry_forward -v
      - name: Build fresh prospective snapshot
        run: |
          mkdir -p artifacts/payoff_geometry_forward/source
          python -m orderflow_edge_lab.cli.payoff_geometry_forward \
            --config config/payoff_geometry_forward_v1.json \
            --output artifacts/payoff_geometry_forward/report.json \
            --source-dir artifacts/payoff_geometry_forward/source \
            --max-workers 5
      - name: Enforce frozen evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/payoff_geometry_forward/report.json",encoding="utf-8"))
          if r["analysis"] != "payoff_geometry_forward_v1":
              raise SystemExit("unexpected payoff geometry forward analysis")
          for report in r["reports"]:
              if report["formal_verdict"] != "WITHHELD":
                  raise SystemExit("early payoff geometry verdict")
          claims=r["claims"]
          for key in ("volatility_filter_authorized","candidate_promoted","profitable_edge_established","live_trading_authorized","leverage_authorized"):
              if bool(claims.get(key)):
                  raise SystemExit(f"forbidden payoff geometry forward claim: {key}")
          if not bool(claims.get("original_trade_generation_unchanged")):
              raise SystemExit("trade-generation boundary lost")
          print(json.dumps({
              "watch_id":r["watch_id"],
              "status":r["status"],
              "prospective_start_utc":r["prospective_start_utc"],
              "as_of_utc":r["as_of_utc"],
              "completed_trades":{x["audit_id"]:x["summary"]["completed_trade_count"] for x in r["reports"]},
              "HIGH_counts":{x["audit_id"]:x["state_summaries"]["HIGH"]["completed_trade_count"] for x in r["reports"]},
              "LOW_counts":{x["audit_id"]:x["state_summaries"]["LOW"]["completed_trade_count"] for x in r["reports"]},
          },indent=2))
          PY
      - name: Preserve payoff geometry forward artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-geometry-forward-v1
          path: artifacts/payoff_geometry_forward/
          retention-days: 90
          if-no-files-found: error
