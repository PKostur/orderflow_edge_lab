name: Published Cross-Sectional Momentum v1.1

on:
  workflow_dispatch:
  push:
    branches: [research/published-cross-sectional-v1]

permissions:
  contents: read

concurrency:
  group: published-cross-sectional-v1-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run frozen funding-aware MEXC cross-sectional replication
        run: |
          mkdir -p artifacts/published_cross_sectional_v1_1
          orderflow-cross-sectional-momentum \
            --config config/published_cross_sectional_v1_1.json \
            --output artifacts/published_cross_sectional_v1_1/report.json \
            --max-workers 8
      - name: Enforce research-only claims
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/published_cross_sectional_v1_1/report.json', encoding='utf-8'))
          c=r['claims']
          if c.get('verified_out_of_sample_evidence') or c.get('profitable_edge_established') or c.get('live_order_transmission_supported'):
              raise SystemExit('cross-sectional development replication emitted a forbidden promotion claim')
          if not all(t.get('funding_included') for t in r['trials']):
              raise SystemExit('v1.1 requires realized funding accounting')
          print(json.dumps({
              'trial_count': r['trial_count'],
              'eligible_count': r['eligible_count'],
              'survivorship_warning': r['survivorship_warning'],
              'trials': r['trials'],
          }, indent=2))
          PY
      - name: Deterministic multi-agent release gate
        run: |
          orderflow-multi-agent --output artifacts/published_cross_sectional_v1_1/multi_agent_report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/published_cross_sectional_v1_1/multi_agent_report.json', encoding='utf-8'))
          if r['release_manager']['status'] != 'reviewable':
              raise SystemExit('release manager blocked cross-sectional replication')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-cross-sectional-v1-1
          path: artifacts/published_cross_sectional_v1_1/
          retention-days: 30
          if-no-files-found: warn
