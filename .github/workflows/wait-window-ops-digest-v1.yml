name: Wait-Window Ops Digest v1

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  pull_request:
    paths:
      - "src/orderflow_edge_lab/ops_digest.py"
      - "src/orderflow_edge_lab/forward_operations_v2.py"
      - "src/orderflow_edge_lab/artifact_coverage.py"
      - "src/orderflow_edge_lab/cli/forward_operations_v2.py"
      - "src/orderflow_edge_lab/review_packet.py"
      - "config/evidence_retention_requirements_v1.json"
      - "config/forward_retention_overlay_v2.json"
      - "config/forward_operations_registry_template_v2.json"
      - "config/prospective_review_clock_v1.json"
      - "tests/test_ops_digest.py"
      - "tests/test_artifact_coverage.py"
      - "tests/test_v2_09_forward_operations.py"
      - "tests/test_review_packet.py"
      - ".github/workflows/wait-window-ops-digest-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run observability unit tests
        run: |
          python -m unittest tests.test_ops_digest tests.test_artifact_coverage tests.test_review_packet tests.test_review_clock -v
      - name: Fetch the newest retained capture sample
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/captures
          # Raw replay samples are retained on a ~4-hourly cadence, so capture
          # freshness is read at that resolution here too.
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("orderflow-discovery-replay-")))) | sort_by(.created_at) | reverse | .[0].id // empty' || true)"
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "no unexpired orderflow-discovery-replay-* artifact found"
            echo "capture_dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/replay.zip
          unzip -q -o /tmp/replay.zip -d artifacts/captures
          SAMPLE="$(find artifacts/captures -type f -name '*_mexc_raw.jsonl' -print -quit || true)"
          if [[ -n "$SAMPLE" ]]; then
            echo "capture_dir=$(dirname "$SAMPLE")" >> "$GITHUB_OUTPUT"
          else
            echo "capture_dir=" >> "$GITHUB_OUTPUT"
          fi
      - name: Inventory retained CI artifacts with explicit acquisition outcome
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | {name, id, created_at, expires_at, size_in_bytes, expired}' \
            > artifacts/artifact_inventory.jsonl 2> artifacts/inventory_acquisition.stderr
          ACQUISITION_RC=$?
          set -e
          python - "$ACQUISITION_RC" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          rc = int(sys.argv[1])
          error_path = Path("artifacts/inventory_acquisition.stderr")
          error = error_path.read_text(encoding="utf-8").strip() if error_path.exists() else ""
          payload = {
              "status": "ACQUIRED" if rc == 0 else "FAILED",
              "pages_fetched": 1 if rc == 0 else 0,
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "error": None if rc == 0 else (error or f"gh api exited {rc}"),
          }
          Path("artifacts/inventory_acquisition.json").write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          if rc != 0:
              # A partial/error body is diagnostic only and must not masquerade as a complete empty inventory.
              Path("artifacts/artifact_inventory.partial.jsonl").write_bytes(Path("artifacts/artifact_inventory.jsonl").read_bytes())
              Path("artifacts/artifact_inventory.jsonl").write_text("", encoding="utf-8")
          PY
          wc -l artifacts/artifact_inventory.jsonl
      - name: Retrieve newest discovery ledger artifact metadata
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/current_ledger
          python - <<'PY'
          import json
          from pathlib import Path

          acquisition = json.loads(Path("artifacts/inventory_acquisition.json").read_text(encoding="utf-8"))
          candidates = []
          if acquisition["status"] == "ACQUIRED":
              for line in Path("artifacts/artifact_inventory.jsonl").read_text(encoding="utf-8").splitlines():
                  item = json.loads(line)
                  if item.get("name") == "orderflow-discovery-ledger-v1" and item.get("expired") is False:
                      candidates.append(item)
          selected = max(candidates, key=lambda item: item.get("created_at", ""), default=None)
          Path("artifacts/ledger_candidate.json").write_text(json.dumps(selected) + "\n", encoding="utf-8")
          PY
          ARTIFACT_ID="$(python -c 'import json; x=json.load(open("artifacts/ledger_candidate.json")); print(x.get("id", "") if x else "")')"
          if [[ -z "${ARTIFACT_ID}" ]]; then
            python - <<'PY'
            import json
            from pathlib import Path
            acquisition=json.loads(Path("artifacts/inventory_acquisition.json").read_text())
            payload={"status":"FAILED" if acquisition["status"] == "FAILED" else "NOT_FOUND", "artifact_id":None, "artifact_created_at_utc":None, "retrieved_at_utc":acquisition["retrieved_at_utc"], "error":acquisition["error"]}
            Path("artifacts/ledger_retrieval.json").write_text(json.dumps(payload, sort_keys=True)+"\n")
            PY
            echo "ledger_manifest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/discovery_ledger.zip; then
            python - "$ARTIFACT_ID" <<'PY'
            import json, sys
            from datetime import datetime, timezone
            from pathlib import Path
            candidate=json.loads(Path("artifacts/ledger_candidate.json").read_text())
            payload={"status":"FAILED", "artifact_id":sys.argv[1], "artifact_created_at_utc":candidate.get("created_at"), "retrieved_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"), "error":"ledger artifact download failed"}
            Path("artifacts/ledger_retrieval.json").write_text(json.dumps(payload, sort_keys=True)+"\n")
            PY
            echo "ledger_manifest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! unzip -q /tmp/discovery_ledger.zip -d artifacts/current_ledger; then
            echo '{"status":"FAILED","artifact_id":null,"artifact_created_at_utc":null,"retrieved_at_utc":null,"error":"ledger artifact unzip failed"}' > artifacts/ledger_retrieval.json
            echo "ledger_manifest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LEDGER_MANIFEST="$(find artifacts/current_ledger -type f -name discovery_ledger_manifest.json -print -quit)"
          if [[ -z "${LEDGER_MANIFEST}" ]]; then
            echo '{"status":"FAILED","artifact_id":null,"artifact_created_at_utc":null,"retrieved_at_utc":null,"error":"ledger artifact contained no manifest"}' > artifacts/ledger_retrieval.json
            echo "ledger_manifest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$ARTIFACT_ID" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          candidate=json.loads(Path("artifacts/ledger_candidate.json").read_text())
          payload={"status":"ACQUIRED", "artifact_id":sys.argv[1], "artifact_created_at_utc":candidate.get("created_at"), "retrieved_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"), "error":None}
          Path("artifacts/ledger_retrieval.json").write_text(json.dumps(payload, sort_keys=True)+"\n")
          PY
          echo "ledger_manifest=${LEDGER_MANIFEST}" >> "$GITHUB_OUTPUT"
      - name: Audit retention coverage
        run: |
          orderflow-artifact-coverage \
            --requirements config/evidence_retention_requirements_v1.json \
            --inventory artifacts/artifact_inventory.jsonl \
            --repo-root . \
            --output artifacts/coverage.json \
            --markdown artifacts/coverage.md
      - name: Build the daily digest
        env:
          CAPTURE_DIR: ${{ steps.fetch.outputs.capture_dir }}
          LEDGER_MANIFEST: ${{ steps.ledger.outputs.ledger_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CAPTURE_DIR}" ]]; then
            DATA_DIR="${GITHUB_WORKSPACE}/${CAPTURE_DIR}"
          else
            DATA_DIR="${GITHUB_WORKSPACE}/artifacts/no_capture_sample"
          fi
          LEDGER_ARGS=()
          if [[ -n "${LEDGER_MANIFEST}" ]]; then
            LEDGER_ARGS+=(--ledger-manifest "${LEDGER_MANIFEST}")
          else
            LEDGER_ARGS+=(--ledger-manifest "")
          fi
          orderflow-ops-digest-v2 \
            --clock-config config/prospective_review_clock_v1.json \
            --data-dir "${DATA_DIR}" \
            "${LEDGER_ARGS[@]}" \
            --coverage-report artifacts/coverage.json \
            --inventory-acquisition artifacts/inventory_acquisition.json \
            --ledger-retrieval artifacts/ledger_retrieval.json \
            --ledger-heartbeat-cadence-hours 1 \
            --ledger-heartbeat-grace-hours 0.5 \
            --output artifacts/ops_digest.json \
            --markdown artifacts/ops_digest.md
      - name: Assert the digest stays reporting-only
        run: |
          python - <<'PY'
          import json
          digest = json.load(open('artifacts/ops_digest.json', encoding='utf-8'))
          claims = digest['claims']
          assert claims['computes_strategy_verdicts'] is False
          assert claims['inspects_strategy_pnl'] is False
          assert claims['counts_prospective_batches'] is False
          assert claims['promotes_any_strategy'] is False
          assert claims['live_order_transmission_supported'] is False
          assert digest['inventory_acquisition']['status'] in {'ACQUIRED', 'FAILED'}
          print('digest_status:', digest['digest_status'])
          print('operational_check_conclusion:', digest['operational_check_conclusion'])
          print('highest_alert_severity:', digest['highest_alert_severity'])
          for alert in digest['alerts']:
              print(f"[{alert['severity']}] {alert['code']}: {alert['detail']}")
          PY
      - name: Publish to the job summary
        if: always()
        run: |
          {
            cat artifacts/ops_digest.md
            echo
            cat artifacts/coverage.md
          } >> "$GITHUB_STEP_SUMMARY" || echo "no digest markdown to publish"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wait-window-ops-digest-v1
          path: |
            artifacts/ops_digest.json
            artifacts/ops_digest.md
            artifacts/coverage.json
            artifacts/coverage.md
            artifacts/inventory_acquisition.json
            artifacts/inventory_acquisition.stderr
            artifacts/artifact_inventory.partial.jsonl
            artifacts/ledger_retrieval.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail confirmed operational health errors after diagnostics upload
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/ops_digest.json')
          if not path.is_file():
              raise SystemExit('ops digest was not produced; diagnostics were uploaded before this gate')
          digest = json.loads(path.read_text(encoding='utf-8'))
          if digest.get('operational_check_conclusion') != 'PASS':
              for alert in digest.get('alerts', []):
                  if alert.get('severity') == 'error':
                      print(f"[error] {alert.get('code')}: {alert.get('detail')}")
              raise SystemExit('operational-health failure: inventory/coverage/heartbeat/capture error')
          print('operational health passed; warnings remain attention-only')
