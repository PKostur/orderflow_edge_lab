name: Gold H4 Divergence Historical Replication v1

on:
  workflow_dispatch:
  push:
    branches: [research/gold-strategy-discovery-v1]
    paths:
      - "config/gold_h4_divergence_historical_replication_v1.json"
      - "config/gold_h4_divergence_historical_replication_v1_1_amendment.json"
      - "scripts/run_gold_h4_divergence_historical_replication_v1.py"
      - ".github/workflows/gold-h4-divergence-historical-replication-v1.yml"

permissions:
  contents: read

concurrency:
  group: gold-h4-divergence-historical-replication-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime
        run: python -m pip install pandas numpy
      - name: Download independent Dukascopy XAUUSD H4 bid history in yearly chunks
        run: |
          set -euo pipefail
          mkdir -p artifacts/gold_h4_divergence_replication/data/chunks
          for year in $(seq 2010 2019); do
            next=$((year + 1))
            out="XAUUSD_DUKASCOPY_H4_${year}_${next}.csv"
            ok=0
            for attempt in 1 2 3 4; do
              if npx --yes dukascopy-node@latest \
                -i xauusd \
                -from "${year}-01-01" \
                -to "${next}-01-01" \
                -t h4 \
                -p bid \
                -v true \
                -f csv \
                -dir artifacts/gold_h4_divergence_replication/data/chunks \
                -fn "$out" \
                -r 3 \
                -re true; then
                ok=1
                break
              fi
              sleep $((attempt * 8))
            done
            test "$ok" -eq 1
            sleep 3
          done
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('artifacts/gold_h4_divergence_replication/data/chunks')
          files = sorted(root.rglob('*.csv'))
          if len(files) != 10:
              raise SystemExit(f'expected 10 yearly csv chunks, found {len(files)}: {files}')
          frames = []
          for p in files:
              d = pd.read_csv(p)
              d['_source_file'] = p.name
              frames.append(d)
          out = pd.concat(frames, ignore_index=True)
          time_col = next((c for c in out.columns if c.lower() in {'timestamp','time','date','datetime'}), out.columns[0])
          ts = pd.to_datetime(out[time_col], utc=True, errors='coerce')
          out = out.assign(_parsed_ts=ts).dropna(subset=['_parsed_ts']).sort_values('_parsed_ts')
          data_cols = [c for c in out.columns if c not in {'_source_file','_parsed_ts'}]
          out = out.drop_duplicates(subset=data_cols, keep='first').drop(columns=['_source_file','_parsed_ts'])
          dest = Path('artifacts/gold_h4_divergence_replication/data/XAUUSD_DUKASCOPY_H4_2010_2020.csv')
          out.to_csv(dest, index=False)
          print({'chunks': len(files), 'rows': len(out), 'first': str(ts.min()), 'last': str(ts.max())})
          PY
          find artifacts/gold_h4_divergence_replication/data -maxdepth 2 -type f -print
          sha256sum artifacts/gold_h4_divergence_replication/data/XAUUSD_DUKASCOPY_H4_2010_2020.csv > artifacts/gold_h4_divergence_replication/data/SHA256SUMS.txt
      - name: Run frozen five-cell replication and 20k cluster permutations per cell
        run: |
          python scripts/run_gold_h4_divergence_historical_replication_v1.py \
            --data artifacts/gold_h4_divergence_replication/data/XAUUSD_DUKASCOPY_H4_2010_2020.csv \
            --output artifacts/gold_h4_divergence_replication/result.json
      - name: Guard holdout and claims
        run: |
          python - <<'PY'
          import json
          p='artifacts/gold_h4_divergence_replication/result.json'
          r=json.load(open(p))
          assert r['holdout_opened'] is False
          assert r['claims']['verified_oos'] is False
          assert r['claims']['profitable_edge_established'] is False
          assert r['claims']['live_enabled'] is False
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-h4-divergence-historical-replication-v1
          path: artifacts/gold_h4_divergence_replication/
          retention-days: 30
          if-no-files-found: warn
