name: Cross-Sectional OKX Archive Funding Coverage v1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/universal-existing-validation
    paths:
      - "src/orderflow_edge_lab/okx_funding_archive.py"
      - "src/orderflow_edge_lab/cli/cross_sectional_okx_archive_funding_coverage.py"
      - "tests/test_okx_funding_archive.py"
      - "config/cross_sectional_okx_archive_funding_coverage_v1.json"
      - "docs/CROSS_SECTIONAL_OKX_ARCHIVE_FUNDING_COVERAGE_V1.md"
      - ".github/workflows/cross-sectional-okx-archive-funding-coverage-v1.yml"

permissions:
  contents: read

concurrency:
  group: cross-sectional-okx-archive-funding-coverage-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research runtime
        run: python -m pip install -e ".[research]"
      - name: Run frozen archive parser tests
        run: python -m unittest tests.test_okx_funding_archive -v
      - name: Audit complete archive funding coverage
        run: |
          mkdir -p artifacts/cross_sectional_okx_archive_funding_coverage
          python -m orderflow_edge_lab.cli.cross_sectional_okx_archive_funding_coverage \
            --candidate config/cross_sectional_candidate_v1.json \
            --config config/cross_sectional_okx_archive_funding_coverage_v1.json \
            --output artifacts/cross_sectional_okx_archive_funding_coverage/report.json \
            --max-workers 6
      - name: Enforce data-quality-only boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("artifacts/cross_sectional_okx_archive_funding_coverage/report.json",encoding="utf-8"))
          if r["analysis"] != "cross_sectional_okx_archive_funding_coverage_v1":
              raise SystemExit("unexpected archive coverage analysis")
          if r["evidence_use"] != "data_quality_only":
              raise SystemExit("archive coverage escaped data-quality boundary")
          contract=r["archive_parser_contract"]
          if contract["expected_csv_header"] != ["instrument_name","funding_rate","funding_time"]:
              raise SystemExit("archive parser contract changed")
          if contract["archive_count"] != 131:
              raise SystemExit("archive count changed")
          c=r["claims"]
          forbidden=(
              "strategy_definition_changed",
              "candidate_retested",
              "historical_economic_result_repaired",
              "candidate_pnl_computed",
              "candidate_promoted",
              "profitable_edge_established",
              "live_trading_authorized",
              "leverage_authorized",
          )
          if any(c.get(name) for name in forbidden):
              raise SystemExit("archive coverage emitted forbidden research claim")
          if not c.get("archive_parser_frozen_before_coverage_result"):
              raise SystemExit("parser freeze provenance missing")
          print(json.dumps({
              "status":r["status"],
              "coverage_fraction":r["coverage_fraction"],
              "required_held_intervals":r["required_held_intervals"],
              "covered_held_intervals":r["covered_held_intervals"],
              "funding_economics_admissible":r["funding_economics_admissible"],
              "archive_count":contract["archive_count"],
              "merged_target_record_count":r["archive_source_summary"]["merged_target_record_count"],
          },indent=2))
          PY
      - name: Preserve archive funding coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-okx-archive-funding-coverage-v1
          path: artifacts/cross_sectional_okx_archive_funding_coverage/
          retention-days: 90
          if-no-files-found: warn
