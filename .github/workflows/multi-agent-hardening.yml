name: Multi-Agent Hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  specialist-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[research]
      - name: Run specialist agents and release manager
        run: orderflow-multi-agent --output artifacts/multi_agent_report.json
      - name: Verify report manifest and release gate
        run: |
          python - <<'PY'
          import json
          from orderflow_edge_lab.multi_agent import verify_report
          report = json.load(open('artifacts/multi_agent_report.json', encoding='utf-8'))
          assert verify_report(report), 'multi-agent manifest verification failed'
          status = report['release_manager']['status']
          assert status != 'blocked', f'multi-agent release manager blocked the change: {report["release_manager"]["next_actions"]}'
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-hardening-report
          path: artifacts/multi_agent_report.json
          if-no-files-found: error
          retention-days: 14
