name: Multi-Agent Hardening

on:
  workflow_dispatch:
  push:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  specialist-release-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[research]
      - name: Run read-only prospective deterministic release profile
        run: >-
          orderflow-governance-v2 release-profile
          --profile release
          --output artifacts/governance_release_profile_v2.json
          --strict
      - name: Verify report hash and release-profile completeness
        run: |
          python - <<'PY'
          import json
          from orderflow_edge_lab.governance_v2 import verify_release_profile_v2
          report = json.load(open('artifacts/governance_release_profile_v2.json', encoding='utf-8'))
          assert verify_release_profile_v2(report), 'governance v2 report verification failed'
          assert report['execution_profile'] == 'release', 'advisory profile is not a release gate'
          assert report['checks_skipped_required'] == 0, 'release profile skipped a required check'
          assert report['release_manager']['status'] == 'reviewable', report['release_manager']
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: governance-release-profile-v2
          path: artifacts/governance_release_profile_v2.json
          if-no-files-found: error
          retention-days: 14
