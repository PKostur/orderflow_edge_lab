name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Preserve exact frozen source bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated checkout-test environment
        run: |
          python -m venv .venv-ci
          python -c "import os,pathlib;root=pathlib.Path('.venv-ci').resolve();scripts=root/('Scripts' if os.name=='nt' else 'bin');pathlib.Path(os.environ['GITHUB_PATH']).open('a',encoding='utf-8').write(str(scripts)+'\n')"
      - name: Install reviewed hash-locked build and research dependency closure
        run: >-
          python -m pip install --require-hashes
          -r requirements/locks/build-ci.txt -r requirements/locks/research-ci.txt
      - name: Install editable project for checkout tests (not artifact proof)
        run: python -m pip install --no-deps --no-build-isolation -e ".[research]"
      - name: Check checkout dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Deployment diagnostics
        run: python scripts/deployment_check.py
      - name: Native clean wheel AND sdist full hash-locked dependency proof
        run: python scripts/verify_packaging.py --work-dir artifacts/packaging-proof
      - name: Upload native artifact installation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaging-proof-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            artifacts/packaging-proof/packaging-proof.json
            artifacts/packaging-proof/logs/*.log
            artifacts/packaging-proof/dist/*
          if-no-files-found: error
          retention-days: 14
