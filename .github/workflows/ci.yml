name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[research]
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Deployment diagnostics
        run: python scripts/deployment_check.py
      - name: Build installable release
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify installed commands outside checkout
        run: python scripts/package_smoke.py dist/orderflow_edge_lab-1.0.0-py3-none-any.whl
