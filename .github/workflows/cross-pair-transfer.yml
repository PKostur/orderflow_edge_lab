name: Cross-Pair Market-Condition Transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-pair-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transfer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Screen liquid MEXC perpetuals without using strategy PnL
        run: |
          mkdir -p artifacts/cross_pair
          orderflow-pair-screen \
            --top 4 \
            --max-spread-bps 5 \
            --min-turnover-usdt 10000000 \
            --output artifacts/cross_pair/pair_screen.json
      - name: Capture selected pairs plus BTC simultaneously
        shell: bash
        run: |
          mapfile -t SYMBOLS < <(python - <<'PY'
          import json
          data=json.load(open('artifacts/cross_pair/pair_screen.json', encoding='utf-8'))
          for symbol in data['selected_symbols']:
              print(symbol)
          PY
          )
          test "${#SYMBOLS[@]}" -gt 0
          ARGS=()
          for SYMBOL in "${SYMBOLS[@]}"; do
            ARGS+=(--symbol "$SYMBOL")
          done
          ARGS+=(--symbol BTC_USDT)
          orderflow-mexc-record \
            "${ARGS[@]}" \
            --duration-seconds 120 \
            --output-dir artifacts/cross_pair/capture
      - name: Run unchanged frozen strategy and market-condition analysis per pair
        shell: bash
        run: |
          FEATURE=$(find artifacts/cross_pair/capture -name '*_mexc_features.jsonl' -print -quit)
          test -n "$FEATURE"
          mapfile -t SYMBOLS < <(python - <<'PY'
          import json
          data=json.load(open('artifacts/cross_pair/pair_screen.json', encoding='utf-8'))
          for symbol in data['selected_symbols']:
              print(symbol)
          PY
          )
          for SYMBOL in "${SYMBOLS[@]}"; do
            orderflow-direction-pair "$FEATURE" \
              --symbol "$SYMBOL" \
              --context-symbol BTC_USDT \
              --output "artifacts/cross_pair/direction_pair_${SYMBOL}.json"
            orderflow-market-conditions "$FEATURE" \
              --symbol "$SYMBOL" \
              --context-symbol BTC_USDT \
              --output "artifacts/cross_pair/conditions_${SYMBOL}.json"
          done
      - name: Aggregate cross-pair transfer evidence
        run: |
          orderflow-cross-pair \
            --screen artifacts/cross_pair/pair_screen.json \
            --results-dir artifacts/cross_pair \
            --output artifacts/cross_pair/cross_pair_summary.json
      - name: Preserve transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-pair-market-condition-transfer
          path: artifacts/cross_pair/
          if-no-files-found: warn
          retention-days: 14
